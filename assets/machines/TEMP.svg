<!-- ============================================================
     ШАБЛОН-ИНСТРУКЦИЯ: сохрани как  assets/machines/cars/_template.svg
     НЕ нумеруй его (01..06) — это только инструкция для художника.
     КООРДИНАТЫ: центр изображения = точка (0,0) машины.
     НОС смотрит ВПРАВО (+X).  Кузов в пределах x[-28..23], y[-11..11].
     Колёса по углам (центры ≈ (-14,±15) и (17,±15)).
     Рисуй свою машину ПОВЕРХ направляющих, сохраняя центр и ориентацию.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="-34 -22 68 44">
  <rect x="-34" y="-22" width="68" height="44" fill="#f7f5f0"/>
  <!-- оси -->
  <line x1="0" y1="-22" x2="0" y2="22" stroke="#333" stroke-width="0.6"/>
  <line x1="-34" y1="0" x2="34" y2="0" stroke="#333" stroke-width="0.6"/>
  <!-- габариты кузова -->
  <rect x="-28" y="-11" width="51" height="22" fill="rgba(255,180,80,.25)" stroke="#f08c1e" stroke-width="1"/>
  <!-- колёса -->
  <g fill="#111" stroke="#888" stroke-width="0.8">
    <rect x="-21" y="-20" width="14" height="9"/>
    <rect x="10"  y="-20" width="14" height="9"/>
    <rect x="-21" y="11"  width="14" height="9"/>
    <rect x="10"  y="11"  width="14" height="9"/>
  </g>
  <g fill="#33ff66">
    <circle cx="-14" cy="-15.5" r="2"/><circle cx="17" cy="-15.5" r="2"/>
    <circle cx="-14" cy="15.5"  r="2"/><circle cx="17" cy="15.5"  r="2"/>
  </g>
  <!-- нос (+X) -->
  <path d="M23 -6 L28 0 L23 6" fill="none" stroke="#f08c1e" stroke-width="1"/>
  <!-- подписи -->
  <g font-family="monospace" font-size="4" fill="#888">
    <text x="1"  y="-18">(0,0) центр · +X вправо (нос)</text>
    <text x="-33" y="-12">y=-11</text>
    <text x="-33" y="16">y=11</text>
    <text x="-31" y="21">x=-28</text>
    <text x="18"  y="21">x=23</text>
  </g>
</svg>