<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' rnr: data:; media-src 'self'; font-src 'self' rnr: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';">
  <title>Колесница войны</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="stage">
    <figure class="hero" id="hero" aria-hidden="true"></figure>
    <div class="vignette" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>
    <canvas id="ash" class="ash" aria-hidden="true"></canvas>
    <div class="chrome">
      <span class="chrome-title">Колесница войны</span>
      <div class="chrome-tools">
        <button class="btn-mute" type="button" id="btn-mute" aria-label="Выключить музыку" aria-pressed="false">
          <svg class="icon-on" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M2 6v4h3l4 3V3L5 6H2zm10.2 2c0-1.4-.8-2.6-2-3.2v6.4c1.2-.6 2-1.8 2-3.2z"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path fill="currentColor" d="M2 6v4h3l4 3V3L5 6H2zm9.1-.2l-.7.7 1.4 1.5-1.4 1.5.7.7 1.5-1.5 1.5 1.5.7-.7-1.5-1.5 1.5-1.5-.7-.7-1.5 1.5z"/>
          </svg>
        </button>
        <button class="btn-close" type="button" id="btn-close" aria-label="Закрыть">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M2 2l12 12M14 2L2 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          </svg>
        </button>
      </div>
    </div>
    <img class="logo" src="media/game-logo.webp" alt="Колесница войны" width="560" height="194" draggable="false">
    <aside class="rail">
      <p class="kicker">DIVAN GAMES · БОЕВЫЕ ГОНКИ</p>
      <nav class="actions" aria-label="Лаунчер">
        <button class="btn primary" type="button" id="btn-play" disabled>Играть</button>
        <button class="btn" type="button" id="btn-self" hidden>Обновить лаунчер</button>
        <button class="btn" type="button" id="btn-sync" hidden>Установить игру</button>
        <button class="btn" type="button" id="btn-verify">Проверить файлы</button>
        <button class="btn" type="button" id="btn-screen">Полный экран</button>
        <button class="btn ghost" type="button" id="btn-quit">Выход</button>
      </nav>
      <div class="dock">
        <p class="lead" id="lead" hidden>Проверка локальных файлов и запуск вне браузера.</p>
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
          <span class="fill" id="fill"></span>
        </div>
        <p class="status" id="status">Считываю состав...</p>
        <p class="meta" id="meta"></p>
      </div>
    </aside>
  </div>
  <script src="ash.js"></script>
  <script src="launcher-audio.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
