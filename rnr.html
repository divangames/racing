function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function wrapBetween(idx,a,b){if(a<=b)return idx>=a&&idx<=b;return idx>=a||idx<=b;}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function panel(c,x,y,w,h,fill,stroke,sk=14){c.beginPath();c.moveTo(x+sk,y);c.lineTo(x+w,y);c.lineTo(x+w-sk,y+h);c.lineTo(x,y+h);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke();}}
/** Путь параллелограмма — для обрезки иконки по карточке. */
function panelPath(c,x,y,w,h,sk=14){c.beginPath();c.moveTo(x+sk,y);c.lineTo(x+w,y);c.lineTo(x+w-sk,y+h);c.lineTo(x,y+h);c.closePath();}
function txt(c,t,x,y,size,col,align='left',font=F_D,stroke=true){c.font=size+'px '+font;c.textAlign=align;c.textBaseline='middle';if(stroke){c.lineWidth=Math.max(2,size/9);c.strokeStyle='#000';c.strokeText(t,x,y);}c.fillStyle=col;c.fillText(t,x,y);}

function drawTheatreBack(){

////////////////////////////////////////////////////////
//
// Перенос подписи по ширине карточки
//

function wrapText(c,text,x,y,maxW,lineH,size,col,font){
 c.font=size+'px '+font;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;
 const words=text.split(' ');let line='';let yy=y;
 for(const w of words){
  const test=line?line+' '+w:w;
  if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lineH;}
  else line=test;
 }
 if(line)c.fillText(line,x,yy);
 return yy;
}
////////////////////////////////////////////////////////
//
// Перенос текста в массив строк (слово, затем символ)
//
////////////////////////////////////////////////////////
function layoutLines(c,text,maxW,size,font){
 c.font=size+'px '+font;
 const words=String(text||'').split(/\s+/).filter(Boolean);
 const lines=[];
 let line='';
 const flush=()=>{if(line){lines.push(line);line='';}};
 const fit=(chunk)=>{
  if(c.measureText(chunk).width<=maxW)return chunk;
  let keep='';
  for(const ch of chunk){
   if(keep&&c.measureText(keep+ch).width>maxW){lines.push(keep);keep=ch;}
   else keep+=ch;
  }
  return keep;
 };
 for(const w of words){
  const test=line?line+' '+w:w;
  if(c.measureText(test).width<=maxW){line=test;continue;}
  flush();
  line=fit(w);
 }
 flush();
 return lines.length?lines:[''];
}
////////////////////////////////////////////////////////

function drawAnnounceToast(c,msg,cx,top,viewWidth){
 if(!msg||!msg.txt)return;
 const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const a=reduce?1:(msg.t<.25?msg.t/.25:msg.t>2.9?clamp((3.4-msg.t)/.5,0,1):1);
 if(a<=0)return;
 const big=!!msg.big;
 const size=big?18:15;
 const lineH=big?22:19;
 const labelH=14;
 const padX=28;
 const padY=14;
 const maxW=Math.min(big?560:500,Math.max(300,viewWidth-380));
 const inner=Math.max(140,maxW-padX*2-8);
 const raw=layoutLines(c,msg.txt,inner,size,F_D);
 const shown=raw.slice(0,3);
 if(raw.length>3){
  let last=shown[2];
  while(last.length>1&&c.measureText(last+'…').width>inner)last=last.slice(0,-1);
  shown[2]=last+'…';
 }
 const textW=shown.reduce((m,l)=>Math.max(m,c.measureText(l).width),0);
 const w=clamp(textW+padX*2+8,220,maxW);
 const h=padY+labelH+shown.length*lineH+padY+2;
 const x=cx-w/2,y=top;
 c.save();
 c.globalAlpha=a;
 rr(c,x,y,w,h,10);
 c.fillStyle='rgba(16,12,22,.94)';c.fill();
 c.strokeStyle='#ff9d2e';c.lineWidth=2;c.stroke();
 c.beginPath();
 if(c.roundRect)c.roundRect(x,y,w,h,10);
 else rr(c,x,y,w,h,10);
 c.clip();
 c.fillStyle='rgba(255,157,46,.16)';
 c.fillRect(x,y,5,h);
 txt(c,'ЭФИР',x+padX,y+padY+labelH/2,11,'#ff9d2e','left',F_B,false);
 const life=clamp(1-msg.t/3.4,0,1);
 c.fillStyle='rgba(255,157,46,.45)';
 c.fillRect(x+padX,y+padY+labelH-2,Math.max(24,(w-padX*2)*life),2);
 const ty=y+padY+labelH+lineH/2;
 shown.forEach((line,i)=>txt(c,line,x+padX,ty+i*lineH,size,'#ffd23f','left',F_D));
 c.restore();
}

const SKILL_MAX=6;
const SKILL_COSTS=[100000,250000,500000,1000000,2000000];
const SKILL_META=[
 {n:'РЕМОНТ-ДРОН',d:'авто-лечение'},
 {n:'ФОРСАЖ-КЛАПАН',d:'нитро-кд'},
 {n:'АГРЕССИЯ',d:'урон'},
 {n:'МИННЫЙ ИММУНИТЕТ',d:'пропуск мин'},
];
function skillT(lvl){return clamp((lvl-1)/(SKILL_MAX-1),0,1);}
function skillVal(chIdx,lvl){
 const t=skillT(lvl);
 if(chIdx===0)return lerp(10,2,t);
 if(chIdx===1)return lerp(0.05,0.15,t);
 if(chIdx===2)return lerp(0.02,0.15,t);
 if(chIdx===3)return lerp(0.10,1.0,t);
 return 0;
}
function SKILL_DESC(chIdx,lvl){
 const v=skillVal(chIdx,lvl);
 if(chIdx===0)return 'полное лечение за '+v.toFixed(1)+'с';
 if(chIdx===1)return 'нитро-кд −'+Math.round(v*100)+'%';
 if(chIdx===2)return 'урон +'+Math.round(v*100)+'%';
 if(chIdx===3)return 'пропуск мин '+Math.round(v*100)+'%';
 return '';
}

function upgradeCharStat(i,key){
 if(!save.cstats)save.cstats={0:{spd:0,crn:0,grt:0},1:{spd:0,crn:0,grt:0},2:{spd:0,crn:0,grt:0},3:{spd:0,crn:0,grt:0}};

}
////////////////////////////////////////////////////////

function buyGym(idx){
 if(!save.cstats)save.cstats={0:{spd:0,crn:0,grt:0},1:{spd:0,crn:0,grt:0},2:{spd:0,crn:0,grt:0},3:{spd:0,crn:0,grt:0}};
 const chI=save.char;
 if(idx<3){
  upgradeCharStat(chI,['spd','crn','grt'][idx]);
  return;
 }
 const lvl=save.skills[chI]||1;
 if(lvl>=SKILL_MAX){garMsg='МАКСИМАЛЬНЫЙ УРОВЕНЬ';garMsgT=2.2;sHit();return;}
 const cost=SKILL_COSTS[lvl-1];
 if(save.cash>=cost){save.cash-=cost;save.skills[chI]=lvl+1;persist();sCash();garMsg='СКИЛЛ УЛУЧШЕН: '+SKILL_META[chI].n;garMsgT=2.2;}
 else{garMsg='НЕ ХВАТАЕТ '+fm(cost-save.cash);garMsgT=2.2;sHit();}
}

/** Подгрузка кадров папки комикса. */
function loadIntroImgs(folder,count){
 const base='assets/image/comics/'+folder+'/';
 return Array.from({length:count},(_,i)=>{
  const n=i+1,img=new Image();
  img.onerror=()=>{
   if(img.dataset.fb)return;
   img.dataset.fb='1';
   img.src=base+n+'.png';
  };
  img.src=base+String(n).padStart(2,'0')+'.webp';
  return img;
 });
}

/** Сцены текущего интро. */
function introScenes(){
 const p=CHAR_INTROS[introChar];
 return (p&&p.scenes)||[];
}
/** Обрезка чёрных полей, которые зашиты в кадры комикса. */
function introCrop(img){
 if(img._crop)return img._crop;
 const w=img.naturalWidth,h=img.naturalHeight;
 if(!w||!h)return{sx:0,sy:0,sw:1,sh:1};
 const full={sx:0,sy:0,sw:w,sh:h};
 const tc=document.createElement('canvas');
 tc.width=w;tc.height=h;
 const tg=tc.getContext('2d',{willReadFrequently:true});
 if(!tg){img._crop=full;return full;}
 tg.drawImage(img,0,0);
 let data;
 try{data=tg.getImageData(0,0,w,h).data;}catch(e){img._crop=full;return full;}
 const isBar=(px)=>{
  const r=data[px],gch=data[px+1],b=data[px+2],a=data[px+3];
  return a<8||(r<8&&gch<8&&b<10);
 };
 let x0=0,x1=w-1,y0=0,y1=h-1;
 scanL:for(;x0<w;x0++){for(let y=0;y<h;y++)if(!isBar((y*w+x0)<<2))break scanL;}
 scanR:for(;x1>x0;x1--){for(let y=0;y<h;y++)if(!isBar((y*w+x1)<<2))break scanR;}
 scanT:for(;y0<h;y0++){for(let x=x0;x<=x1;x++)if(!isBar((y0*w+x)<<2))break scanT;}
 scanB:for(;y1>y0;y1--){for(let x=x0;x<=x1;x++)if(!isBar((y1*w+x)<<2))break scanB;}
 const sw=x1-x0+1,sh=y1-y0+1;
 img._crop=(sw<w*0.35||sh<h*0.35)?full:{sx:x0,sy:y0,sw:sw,sh:sh};
 return img._crop;
}

function mineExplode(m,owner){
 const pow=m.pow||36,rad=m.rad||100;
 boom(m.x,m.y,false);sBoom();if(nearP(m.x,m.y,700))doShake(8);
 for(const r of R.racers){if(r.dead)continue;
  if(r.cloak&&r.cloak>0&&r.car.idx===5)continue;
  const d=Math.hypot(r.x-m.x,r.y-m.y);
  let dmg=(pow-d*.22)*(1-d/260);

  if(d<rad)dmgRacer(r,dmg,owner);}}

function stepVehicle(r,th,steer,dt){
 const S=R.S,p=S[r.trackIdx];
 const off=!r.air&&Math.hypot(r.x-p.x,r.y-p.y)>ROADW;
 let mult=1;if(r.bolt>0)mult*=1.3;
 if(r.nitro>0)mult*=(r.car.idx===1?1.6:1.45);
 mult=Math.min(mult,1.6);
 let top=r.st.top*(off?r.st.off:1)*mult;
 if(!r.isP){
  top*=1+.05*Math.min(3,R.div-1);
  const deficit=(P.prog-r.prog)/R.N;top*=1+clamp(deficit*.4,-.06,.1);}
 const acc=r.st.acc;
 const tgt=th>0?top*th:(th<0?top*.35*th:0);
 const rate=th===0?240:620;
 if(Math.abs(tgt)>Math.abs(r.spd))r.spd+=clamp(tgt-r.spd,-acc*dt,acc*dt);
 else r.spd+=clamp(tgt-r.spd,-rate*dt,rate*dt);
 if(th===0)r.spd*=Math.max(0,1-1.1*dt);
 if(r.finished)r.spd*=Math.max(0,1-3*dt); // после финиша резко тормозим
 const sf=clamp(Math.abs(r.spd)/140,0,1)*(r.spd<0?-1:1);
 const oldAng=r.ang;
 r.ang+=steer*r.st.crn*.95*sf*(r.air?0.35:1)*dt;
 const ad=r.ang-oldAng;
 r.wheelAngle=lerp(r.wheelAngle,ad*18,dt*10);
 r.wheelRot+=r.spd*dt*0.18;
 // Следы от шин при дрифте (отдельно для каждого колеса)
 const drift=Math.abs(ad)*Math.abs(r.spd);
 if(!r.car.hov&&!r.air&&(drift>3&&Math.abs(r.spd)>100||(r.finished&&Math.abs(steer)>0.2&&Math.abs(r.spd)>40))&&settings.graphics.skids){
  const wx1=r.x-Math.cos(r.ang)*14-Math.sin(r.ang)*14;
  const wy1=r.y-Math.sin(r.ang)*14+Math.cos(r.ang)*14;
  const wx2=r.x-Math.cos(r.ang)*14+Math.sin(r.ang)*14;
  const wy2=r.y-Math.sin(r.ang)*14-Math.cos(r.ang)*14;
  const prev=R.skids.length>0?R.skids[R.skids.length-1]:null;
  R.skids.push({
   lx:wx1,ly:wy1,rx:wx2,ry:wy2,
   plx:prev?prev.lx:wx1,ply:prev?prev.ly:wy1,
   prx:prev?prev.rx:wx2,pry:prev?prev.ry:wy2,
   ang:r.ang,t:6
  });
  if(R.skids.length>800)R.skids.shift();
 }
 let oil=false;for(const o of R.oils)if(Math.hypot(r.x-o.x,r.y-o.y)<34){oil=true;break;}
 if(oil&&!r.air&&r.car.idx!==3)r.ang+=Math.sin(gt*14+r.slot*3)*2.4*dt;
 // Скольжение на льду
 if(R.T.theme.deco==='ice'&&!r.air&&r.car.idx!==3){
  const slip=Math.sin(gt*8+r.slot*2)*1.8*dt;
  r.ang+=slip*(Math.abs(r.spd)/r.st.top);
 }
 // Погода
 if(settings.graphics.weather&&R.weather.parts>0&&r.car.idx!==3){
  const slip=Math.sin(gt*12+r.slot*3)*(1-R.weather.mod)*2*dt;
  r.ang+=slip*(Math.abs(r.spd)/r.st.top);
 }
 if(r.car.idx===2)r.hp=Math.min(r.maxhp,r.hp+2*dt);
 if(r.chIdx===0){const ht=skillVal(0,r.skillLvl);r.hp=Math.min(r.maxhp,r.hp+(r.maxhp/ht)*dt);}
 r.x+=Math.cos(r.ang)*r.spd*dt;r.y+=Math.sin(r.ang)*r.spd*dt;
 r.x=clamp(r.x,20,R.T.w-20);r.y=clamp(r.y,20,R.T.h-20);
 // ТРАМПЛИН: прыжок. Высота/дальность зависят от скорости (баланс).
 if(!r.air){
  for(const rp of R.ramps){
   if(Math.hypot(r.x-rp.x,r.y-rp.y)<46&&Math.abs(r.spd)>140){
    r.air=true;

    r.jumps++;

    break;
   }
  }
 }
 // Баллистика полёта и приземление
 if(r.air){
  r.vz-=900*dt;
  r.z+=r.vz*dt;
  if(r.z<=0&&r.vz<0){
   r.z=0;r.vz=0;r.air=false;
   const shk=(r.lvl&&r.lvl.shk)||0;
   for(const o of R.racers){if(o===r||o.dead||o.air)continue;
    if(Math.hypot(o.x-r.x,o.y-r.y)<52){
     const fdmg=(18+r.jumpSpd*0.06)*(1-(o.lvl&&o.lvl.shk||0)*0.05)*(r.dmgMul||1);

   if(selfDmg>0)dmgRacer(r,selfDmg,null);
   spark(r.x,r.y,'rgba(140,110,70,.7)',12,150);
   if(r.isP){doShake(6);swp('triangle',90,35,.2,.3);}
  }
 }
 if(off&&Math.abs(r.spd)>70&&Math.random()<dt*30)
  R.parts.push({x:r.x-Math.cos(r.ang)*18,y:r.y-Math.sin(r.ang)*18,vx:rnd(-30,30),vy:rnd(-30,30),t:.6,col:'rgba(140,110,70,.5)',sz:rnd(4,9)});
 if(r.nitro>0&&Math.random()<dt*40)
  R.parts.push({x:r.x-Math.cos(r.ang)*26,y:r.y-Math.sin(r.ang)*26,vx:-Math.cos(r.ang)*120+rnd(-30,30),vy:-Math.sin(r.ang)*120+rnd(-30,30),t:.3,col:Math.random()<.5?'#35e0ff':'#fff',sz:rnd(3,6)});
 if(r.hp<r.maxhp*.35){r.smokeT-=dt;if(r.smokeT<=0){r.smokeT=.12;
  R.parts.push({x:r.x,y:r.y,vx:rnd(-20,20),vy:rnd(-40,-10),t:.8,col:'rgba(40,40,40,.6)',sz:rnd(5,10)});}}
 // Проверка секретных срезов
 if(r.isP&&R.shortcuts){
  for(const sc of R.shortcuts){
   if(sc.used)continue;
   const dx=r.x-sc.entry[0],dy=r.y-sc.entry[1];
   const dist=Math.sqrt(dx*dx+dy*dy);
   if(dist<sc.radius){
    sc.glow=1;
    const vx=Math.cos(r.ang)*r.spd,vy=Math.sin(r.ang)*r.spd;
    const toExitX=sc.exit[0]-r.x,toExitY=sc.exit[1]-r.y;
    const dot=vx*toExitX+vy*toExitY;
    if(dot>0&&r.spd>100){
     r.x=sc.exit[0];r.y=sc.exit[1];
     r.prog+=sc.bonus;
     sc.used=true;
     fl(r.x,r.y,'СРЕЗКА: '+sc.name+'!','#ff9d2e');
     swp('sine',300,900,.3,.3);
     doShake(8);
    }
   }
  }
 }
 r.invuln-=dt;r.bolt-=dt;r.nitro-=dt;
 r.cdN-=dt;r.cdW-=dt;r.cdU-=dt;r.slow-=dt;r.drone-=dt;r.buffDmgT-=dt;
 if(r.buffDmgT<=0)r.buffDmg=1;
 if(r.berserk>0)r.berserk-=dt;
 if(r.cloak>0)r.cloak=Math.max(0,r.cloak-dt);
}
function advanceIdx(r){
 const S=R.S,N=R.N;let best=r.trackIdx,bd=1e18;
 for(let k=-4;k<=26;k++){const i=(r.trackIdx+k+N)%N,dx=r.x-S[i].x,dy=r.y-S[i].y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
 if(r.trackIdx>N*.75&&best<N*.25){r.lap++;
  {const lt=R.time-r.lapStart;r.lastLap=lt;r.lapStart=R.time;if(r.isP&&r.lap>=1&&(!r.bestLap||lt<r.bestLap))r.bestLap=lt;}
  if(r.lap>=LAPS){
   r.hp=r.maxhp;
   if(r.isP){r.cdN=0;r.cdW=0;r.cdU=0;fl(r.x,r.y,'ПОЛНОЕ ВОССТАНОВЛЕНИЕ!','#58ff6b');sReload();}
   else{r.cdN=0;r.cdW=0;r.cdU=0;}
   finishRacer(r);
  }
  else{
   if(r.isP){
    if(r.hp<r.maxhp*.7||r.cdN>0||r.cdW>0||r.cdU>0){
     r.hp=Math.min(r.maxhp,r.hp+40);
     r.cdN=Math.max(0,r.cdN-5);
     r.cdW=Math.max(0,r.cdW-2);
     r.cdU=Math.max(0,r.cdU-5);
     fl(r.x,r.y,'КРУГ! +РЕСУРСЫ','#35e0ff');
     sReload();
    }
    if(r.lap===LAPS-1)announce('ФИНАЛЬНЫЙ КРУГ — ЖГИ!',true);
    else if(r.lap>0)announce('КРУГ '+(r.lap+1)+' ИЗ '+LAPS);
    sBeep(660);
   }else{
    r.hp=Math.min(r.maxhp,r.hp+30);
    r.cdN=0;r.cdW=0;r.cdU=0;
   }
  }
 }
 else if(r.trackIdx<N*.25&&best>N*.75)r.lap--;
 r.trackIdx=best;r.prog=r.lap*N+best;
}
function aiThink(r,dt){
 const S=R.S,N=R.N;
 r.laneT-=dt;if(r.laneT<=0){r.laneT=2+Math.random()*3;r.aiLane=clamp(r.aiLane+rnd(-35,35),-55,55);}
 const look=(10+Math.abs(r.spd)*.05)|0,i2=(r.trackIdx+look)%N;
 const tx=S[i2].x+S[i2].nx*r.aiLane,ty=S[i2].y+S[i2].ny*r.aiLane;
 const want=Math.atan2(ty-r.y,tx-r.x),d=angDiff(want,r.ang);
 let steer=clamp(d*2.4,-1,1),th=1;
 for(const o of R.racers){if(o===r||o.dead||o.finished)continue;
  const dx=o.x-r.x,dy=o.y-r.y,dist=Math.hypot(dx,dy);
  if(dist<95&&Math.abs(angDiff(Math.atan2(dy,dx),r.ang))<.8){
   const side=Math.sin(Math.atan2(dy,dx)-r.ang)>0?-1:1;steer+=side*.7;}}
 const i3=(r.trackIdx+24)%N;
 if(S[i3].k>.011&&Math.abs(r.spd)>170)th=-.15;
 if(Math.abs(r.spd)<20&&!r.revT)r.stuckT+=dt;else r.stuckT=0;
 if(r.stuckT>2.5){r.revT=.8;r.stuckT=0;}
 if(r.revT>0){r.revT-=dt;th=-1;steer=-steer;}
 r.ith=th;r.ist=clamp(steer,-1,1);
 let bestT=null,bd=1e9;
 for(const o of R.racers){if(o===r||o.dead||o.finished)continue;const dd=Math.hypot(o.x-r.x,o.y-r.y);if(dd<bd){bd=dd;bestT=o;}}
 if(bestT&&bd<400&&Math.abs(angDiff(Math.atan2(bestT.y-r.y,bestT.x-r.x),r.ang))<.4&&r.cdW<=0&&Math.random()<dt*1.4*r.skill)fireWeapon(r);
 if(S[(r.trackIdx+30)%N].k<.004&&!r.nitro&&r.cdN<=0&&Math.random()<dt*.25*r.skill)useNitro(r);
 if(r.cdU<=0&&(bestT&&bd<300||r.hp<r.maxhp*.4)&&Math.random()<dt*.5*r.skill)useUlt(r);
}

function drawIntro(){
 const pack=CHAR_INTROS[introChar];
 const scenes=introScenes();
 const sc=scenes[introFrame];
 if(!pack||!sc)return;
 g.setTransform(1,0,0,1,0,0);
 const IW=cv.width,IH=cv.height;
 const s=Math.min(IW/1280,IH/720);
 const pad=Math.max(16,Math.round(22*s));
 const img=pack.imgs[sc.img];
 const accent=pack.col||'#ffd23f';
 g.fillStyle='#050409';g.fillRect(0,0,IW,IH);
 const panelH=Math.round(IH*0.64);
 if(img&&img.complete&&img.naturalWidth>0){
  const crop=introCrop(img);
  g.save();
  g.beginPath();g.rect(0,0,IW,panelH);g.clip();
  const cover=Math.max(IW/crop.sw,panelH/crop.sh);
  g.drawImage(img,crop.sx,crop.sy,crop.sw,crop.sh,(IW-crop.sw*cover)/2,(panelH-crop.sh*cover)/2,crop.sw*cover,crop.sh*cover);
  g.fillStyle='rgba(5,4,9,.78)';g.fillRect(0,0,IW,panelH);
  const fit=Math.min(IW/crop.sw,panelH/crop.sh);
  g.drawImage(img,crop.sx,crop.sy,crop.sw,crop.sh,(IW-crop.sw*fit)/2,(panelH-crop.sh*fit)/2,crop.sw*fit,crop.sh*fit);
  if(!introReduceMotion){
   const step=Math.max(3,Math.round(3*s));
   g.fillStyle='rgba(0,0,0,.08)';
   for(let yy=0;yy<panelH;yy+=step)g.fillRect(0,yy,IW,1);
  }

 }else{
  g.fillStyle='#181420';g.fillRect(0,0,IW,panelH);
  txt(g,'[КАДР '+(introFrame+1)+']',IW/2,panelH/2,Math.round(22*s),'#6f6880','center');
 }
 g.fillStyle=accent;g.fillRect(0,panelH,IW,Math.max(2,Math.round(2*s)));

 g.fillStyle='#0c0a14';g.fillRect(0,boxY,IW,IH-panelH);
 g.strokeStyle=accent;g.globalAlpha=.22;g.lineWidth=1;
 g.beginPath();g.moveTo(pad,boxY+1);g.lineTo(IW-pad,boxY+1);g.stroke();g.globalAlpha=1;

 txt(g,pack.name,IW-pad,headY,Math.round(14*s),accent,'right',F_B);

 const lines=layoutLines(g,shown+cursor,wrapW,fs,F_B);

 lines.forEach((ln,i)=>txt(g,ln,IW/2,textTop+i*lineH,fs,'#f2eef8','center',F_B));

 txt(g,allPrinted?'ENTER — ДАЛЬШЕ  ·  ESC — ПРОПУСТИТЬ ИНТРО':'ENTER — УСКОРИТЬ  ·  ESC — ПРОПУСТИТЬ ИНТРО',IW/2,hintY,Math.round(13*s),'#6f6880','center',F_B);

 for(let i=0;i<n;i++){

addEventListener('keydown',e=>{
 if(!AU.ctx)audioInit();
 const gameCodes=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD',
  'ControlLeft','ControlRight','AltLeft','AltRight','ShiftLeft','ShiftRight','Tab','Escape',
  'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','Backquote','Backspace'];
 const modAny=e.ctrlKey||e.altKey||e.metaKey;
 const blockAlways=gameCodes.includes(e.code)||(modAny&&(e.code.startsWith('Key')||e.code.startsWith('Arrow')||e.code.startsWith('Digit')||e.code.startsWith('F')));
 if(e.code==='Space'||blockAlways)e.preventDefault();
 if(e.code==='Tab'||e.code.startsWith('F'))e.preventDefault();
 keys[e.code]=true;
 if(e.repeat)return;
 press(e.code,e.key);});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('visibilitychange',()=>{if(document.hidden)for(const k in keys)keys[k]=false;});
function press(c,k){
 if(c==='KeyM'&&state!=='cheats'){if(AU.ctx){settings.sound.musicOn=!settings.sound.musicOn;saveSettings();applyAudioSettings();}return;}
 if(state==='race'&&settings.controls.pause.includes(c)){
  if(paused){paused=false;}else{paused=true;pauseMenuIndex=0;}
  sClick();return;}
 if(state==='race'&&paused){
  const n=4;
  if(c==='ArrowUp'){pauseMenuIndex=(pauseMenuIndex+n-1)%n;sClick();return;}
  if(c==='ArrowDown'){pauseMenuIndex=(pauseMenuIndex+1)%n;sClick();return;}
  if(c==='Enter'||c==='Space'){
   if(pauseMenuIndex===0){paused=false;}
   else if(pauseMenuIndex===1){settingsReturn='race';settingsState='main';settingsTab=0;state='settings';}
   else if(pauseMenuIndex===2){restartRace();}
   else{paused=false;state='garage';}
   sClick();}
  return;}
 if(state==='race'&&c==='KeyR'){restartRace();return;}
 if(state==='race'&&c==='F3'){settings.graphics.showFps=!settings.graphics.showFps;saveSettings();return;}
 if(state==='slotSelect'){
  if(c==='ArrowLeft'){slotSelectIndex=(slotSelectIndex+9)%10;sClick();}
  if(c==='ArrowRight'){slotSelectIndex=(slotSelectIndex+1)%10;sClick();}
  if(c==='ArrowUp'){slotSelectIndex=(slotSelectIndex+5)%10;sClick();}
  if(c==='ArrowDown'){slotSelectIndex=(slotSelectIndex+5)%10;sClick();}
  if(c==='Escape'){if(slotReturn==='title')enterTitle();else state=slotReturn;sClick();return;}
  if(c==='Enter'||c==='Space'){
   if(slotSelectMode==='load'){
    if(slots[slotSelectIndex]){
     loadSave(slotSelectIndex);
     save=JSON.parse(JSON.stringify(slots[slotSelectIndex].save));
     state='garage';
    }else{
     sHit();
    }
   }else if(slotSelectMode==='save'){
    persist(slotSelectIndex);
    sCash();
    state='garage';
   }
   sClick();
  }
  return;
 }
 if(state==='settings'){
  if(settingsState==='main'){
   if(c==='ArrowUp'){settingsTab=(settingsTab+3)%4;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%4;sClick();}
   if(c==='Enter'||c==='Space'){
    if(settingsTab===0){settingsState='graphics';settingsTab=0;}
    else if(settingsTab===1){settingsState='controls';settingsTab=0;}
    else if(settingsTab===2){settingsState='sound';settingsTab=0;}
    else{if(settingsReturn==='title')enterTitle();else state=settingsReturn;settingsState='main';settingsTab=0;}
    sClick();
   }
   if(c==='Escape'){if(settingsReturn==='title')enterTitle();else state=settingsReturn;settingsState='main';settingsTab=0;sClick();return;}
  }
  else if(settingsState==='graphics'){
   const opts=['resolution','particles','skids','weather','shake','showFps'];
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+5)%6;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%6;sClick();}
   if(c==='ArrowLeft'||c==='ArrowRight'){
    const key=opts[settingsTab];
    if(key==='resolution'){
     const n=RESOLUTIONS.length,cur=settings.graphics.resolution||0;
     settings.graphics.resolution=c==='ArrowRight'?(cur+1)%n:(cur+n-1)%n;
     applyResolution();
    }
    else if(key==='particles'){
     const vals=['low','medium','high'];
     const idx=vals.indexOf(settings.graphics.particles);
     settings.graphics.particles=vals[c==='ArrowRight'?(idx+1)%3:(idx+2)%3];
    }else{
     settings.graphics[key]=!settings.graphics[key];
    }
    saveSettings();sClick();
   }
  }
  else if(settingsState==='sound'){
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+3)%4;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%4;sClick();}
   if(c==='ArrowLeft'||c==='ArrowRight'){
    const dir=c==='ArrowRight'?1:-1;
    if(settingsTab===0){
     settings.sound.music=clamp(settings.sound.music+dir*10,0,100);
     if(AU.ctx)applyAudioSettings();
    }
    else if(settingsTab===1){
     settings.sound.sfx=clamp(settings.sound.sfx+dir*10,0,100);
     if(AU.ctx)AU.sfx.gain.value=settings.sound.sfx/100*.9;
    }
    else if(settingsTab===2){
     settings.sound.musicOn=!settings.sound.musicOn;
     if(AU.ctx)applyAudioSettings();
    }
    else if(settingsTab===3){
     settings.sound.sfxOn=!settings.sound.sfxOn;
    }
    saveSettings();
    sClick();
   }
  }
  else if(settingsState==='controls'){
   const keys_list=['up','down','left','right','pause','_reset'];
   
   if(c==='Escape'){
    if(controlCaptureKey){
     if(captureBackup)settings.controls[controlCaptureKey]=captureBackup;
     controlCaptureKey=null;captureBackup=null;
     sClick();
    }else{settingsState='main';settingsTab=0;sClick();}
    return;
   }
   
   if(controlCaptureKey){
    if(c==='Enter'){
     if(settings.controls[controlCaptureKey].length===0&&captureBackup){
      settings.controls[controlCaptureKey]=captureBackup;
     }
     controlCaptureKey=null;captureBackup=null;
     saveSettings();sClick();
     return;
    }
    if(c==='Backspace'){
     settings.controls[controlCaptureKey].pop();
     saveSettings();sClick();
     return;
    }
    // Игнорируем системные клавиши (но Space — разрешаем)
    const sysKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Tab','CapsLock','Backspace'];
    if(sysKeys.includes(c))return;
    
    const arr=settings.controls[controlCaptureKey];
    if(arr.includes(c))return; // уже есть — игнор
    
    // Удаляем эту клавишу из других действий
    for(const k of Object.keys(settings.controls)){
     if(k!==controlCaptureKey){
      const idx=settings.controls[k].indexOf(c);
      if(idx>=0)settings.controls[k].splice(idx,1);
     }
    }
    if(arr.length<2)arr.push(c);
    else arr[1]=c; // заменяем вторую
    saveSettings();sClick();
    return;
   }
   
   if(c==='ArrowUp'){settingsTab=(settingsTab+5)%6;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%6;sClick();}
   if(c==='Enter'||c==='Space'){
    const key=keys_list[settingsTab];
    if(key==='_reset'){
     resetControls();sClick();
    }else{
     controlCaptureKey=key;
     captureBackup=(settings.controls[key]||[]).slice();
     settings.controls[key]=captureBackup.slice(); // редактируем копию
     saveSettings();sClick();
    }
   }
  }
  return;
 }
 if(state==='intro'){
  if(c==='Escape'){endIntro(false);sClick();return;}
  if(c==='Enter'||c==='Space'){
   const sc=introScenes()[introFrame];
   if(!sc){endIntro(true);return;}
   if(introCur<sc.text.length)introCur=sc.text.length;
   else{
    introFrame++;
    if(introFrame>=introScenes().length)endIntro(true);
    else resetIntroType();
   }
   sClick();return;
  }
  return;
 }
 if(state==='gym'){
  if(c==='Escape'){state='garage';sClick();return;}
  if(c==='ArrowUp'){gymSel=(gymSel+3)%4;sClick();return;}
  if(c==='ArrowDown'){gymSel=(gymSel+1)%4;sClick();return;}
  if(c==='Enter'||c==='Space'){buyGym(gymSel);return;}
  return;
 }
 if(state==='cheats'){
  if(c==='Escape'){state='title';sClick();return;}
  if(c==='ArrowLeft'){cheatCur=(cheatCur+6)%7;sClick();return;}
  if(c==='ArrowRight'){cheatCur=(cheatCur+1)%7;sClick();return;}
  if(c==='ArrowUp'){cheatBuf[cheatCur]=nextChar(cheatBuf[cheatCur],1);sClick();return;}
  if(c==='ArrowDown'){cheatBuf[cheatCur]=nextChar(cheatBuf[cheatCur],-1);sClick();return;}
  if(c==='Enter'){submitCheat();return;}
  if(k&&/^[a-z]$/i.test(k)){cheatBuf[cheatCur]=k.toLowerCase();cheatCur=(cheatCur+1)%7;sClick();return;}
  if(c==='Backspace'){cheatBuf[cheatCur]='a';sClick();return;}
  return;
 }
 if(state==='help'){enterTitle();return;}
 if(state==='achievements'){enterTitle();return;}
 if(state==='char'){
  if(bioOpen>=0){
   if(c==='Enter'){confirmCharPick(bioOpen);sClick();}
   else if(c==='Escape'){bioOpen=-1;sClick();}
   return;
  }
  if(c==='ArrowLeft'){selChar=(selChar+3)%4;sClick();}
  if(c==='ArrowRight'){selChar=(selChar+1)%4;sClick();}
  if(c==='Enter'||c==='KeyB'){bioOpen=selChar;sClick();}
  return;
 }
 if(state==='car'){
  if(c==='ArrowLeft'){pickCarSel(selCar-1);}
  if(c==='ArrowRight'){pickCarSel(selCar+1);}
  if(c==='Escape'){state='char';return;}
  if(c==='Enter'){
   const car=CARS[selCar];
   const owned=selCar===0||(save.carOwned&&save.carOwned[selCar]);
   if(owned){if(carConfirmed&&save.car===selCar){state='garage';}
    else{save.car=selCar;persist();carConfirmed=true;sClick();}}
   else if(save.cash>=car.price){
    save.cash-=car.price;save.carOwned=save.carOwned||{};save.carOwned[selCar]=true;save.car=selCar;
    persist();carConfirmed=true;sCash();}
   else sHit();}return;}
 if(state==='autopark'){
  if(c==='ArrowLeft'){autoparkSel=(autoparkSel+CARS.length-1)%CARS.length;sClick();}
  if(c==='ArrowRight'){autoparkSel=(autoparkSel+1)%CARS.length;sClick();}
  if(c==='ArrowUp'){autoparkSel=(autoparkSel+CARS.length-3)%CARS.length;sClick();}
  if(c==='ArrowDown'){autoparkSel=(autoparkSel+3)%CARS.length;sClick();}
  if(c==='Escape'){state='garage';sClick();}
  if(c==='Enter'||c==='Space'){
   if(carUnlocked(autoparkSel)){autodetailOpen=true;state='detail';sClick();}
   else sHit();
  }
  return;
 }
 if(state==='detail'){
  if(c==='Escape'){state='autopark';autodetailOpen=false;sClick();}
  if(c==='Enter'||c==='Space'){
   const car=CARS[autoparkSel];
   const owned=autoparkSel===0||(save.carOwned&&save.carOwned[autoparkSel]);
   if(owned){
    save.car=autoparkSel;persist();sClick();
    state='garage';garMsg='ВЫБРАНА: '+car.name;garMsgT=2.2;
   }else if(save.cash>=car.price){
    save.cash-=car.price;save.carOwned=save.carOwned||{};
    save.carOwned[autoparkSel]=true;save.car=autoparkSel;
    persist();sCash();state='garage';
    garMsg='КУПЛЕНА: '+car.name;garMsgT=2.2;
   }else sHit();
  }
  return;
 }
 if(state==='prerace'){
  if(c==='ArrowUp'){save.bet=(save.bet+2)%3;persist();sClick();}
  if(c==='ArrowDown'){save.bet=(save.bet+1)%3;persist();sClick();}
  if(c==='Escape'){state='garage';sClick();}
  if(c==='Enter'||c==='Space'){buildRace();}
  return;
 }
 if(state==='title'){
  const n=g._titleItems?g._titleItems.length:2;
  if(c==='ArrowUp'){selTitle=(selTitle+n-1)%n;resetArm=false;sClick();}
  if(c==='ArrowDown'){selTitle=(selTitle+1)%n;resetArm=false;sClick();}
  if(c==='Enter'||c==='Space'){
   const items=g._titleItems;
   const it=items[selTitle];
   if(it&&it.startsWith('НОВАЯ')){
    resetArm=false;save=newSave();persist();
    selChar=0;selCar=0;carConfirmed=false;state='char';
   }
   else if(it&&it.startsWith('ПРОДОЛЖИТЬ')){resetArm=false;state='garage';}
   else if(it&&it.startsWith('ЗАГРУЗИТЬ')){resetArm=false;slotReturn='title';state='slotSelect';slotSelectMode='load';slotSelectIndex=0;}
   else if(it&&it.startsWith('НАСТРОЙКИ')){resetArm=false;settingsReturn='title';state='settings';settingsState='main';settingsTab=0;}
   else if(it&&it.startsWith('ДОСТИЖЕНИЯ')){resetArm=false;state='achievements';}
   else if(it&&it.startsWith('ЧИТЫ')){resetArm=false;state='cheats';cheatMsgT=0;}
   else if(it&&it.startsWith('СБРОС')){
    if(!resetArm){resetArm=true;sClick();}
    else{
     try{
      localStorage.removeItem(SKEY);
      localStorage.removeItem(SLOTS_KEY);
      localStorage.removeItem(SETTINGS_KEY);
      for(let i=0;i<10;i++)localStorage.removeItem(SLOTS_KEY+'_'+i);
     }catch(e){}
     save=null;slots=new Array(10).fill(null);saveSlots();
     settings={
      graphics:{resolution:0,particles:'high',skids:true,weather:true,shake:true,showFps:false},
      controls:{
       up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],
       left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],
       pause:['Escape']
      },
      sound:{music:50,sfx:80,musicOn:true,sfxOn:true}
     };
     saveSettings();applyAudioSettings();applyResolution();
     resetArm=false;sBoom();
    }
   }
   sClick();
  }return;}
 if(state==='results'){if(c==='Enter'){state='garage';sClick();}return;}
 if(state==='garage'&&c==='Escape'){
  if(garagePaused){garagePaused=false;}else{garagePaused=true;garagePauseIndex=0;}
  sClick();return;}
 if(state==='garage'&&garagePaused){
  const n=5;
  if(c==='ArrowUp'){garagePauseIndex=(garagePauseIndex+n-1)%n;sClick();return;}
  if(c==='ArrowDown'){garagePauseIndex=(garagePauseIndex+1)%n;sClick();return;}
  if(c==='Enter'||c==='Space'){
   if(garagePauseIndex===0){garagePaused=false;}
   else if(garagePauseIndex===1){garagePaused=false;slotReturn='garage';state='slotSelect';slotSelectMode='save';slotSelectIndex=0;}
   else if(garagePauseIndex===2){garagePaused=false;slotReturn='garage';state='slotSelect';slotSelectMode='load';slotSelectIndex=0;}
   else if(garagePauseIndex===3){settingsReturn='garage';settingsState='main';settingsTab=0;state='settings';}
   else{garagePaused=false;enterTitle();}
   sClick();}
  return;}
 if(state==='garage'){
  const rows=8;
  if(c==='ArrowUp'){tuningSel=(tuningSel+rows-1)%rows;sClick();}
  if(c==='ArrowDown'){tuningSel=(tuningSel+1)%rows;sClick();}
  if(c==='KeyA'){state='autopark';sClick();}
  if(c==='Space'||(c==='Enter'&&tuningSel===7)){state='prerace';sClick();}
  else if(c==='Enter'){
   if(tuningSel===6){state='autopark';sClick();}
   else garageAction(0,tuningSel);
  }
  return;
 }}
function garageAction(col,row){
 if(row===6){state='autopark';sClick();return;}
 if(row===7){state='prerace';sClick();return;}
 if(row===5){gymSel=0;state='gym';sClick();return;}
 if(col===0){
  const tuningKeys=['arm','eng','tir','shk','nit'];
  const k=tuningKeys[row];
  const lvl=save.tuning[save.car][k];
  if(lvl>=6){garMsg='МАКСИМАЛЬНЫЙ УРОВЕНЬ';garMsgT=2.2;sHit();}
  else{
   const cost=UP_COSTS[k][lvl];
   if(save.cash>=cost){
    save.cash-=cost;save.tuning[save.car][k]++;
    persist();sCash();garMsg='УСТАНОВЛЕНО: '+UP_INFO[k].n;garMsgT=2.2;
   }else{garMsg='НЕ ХВАТАЕТ '+fm(cost-save.cash);garMsgT=2.2;sHit();}
  }
 }
}
let mx=0,my=0;
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();const px=(e.clientX-r.left)*(cv.width/r.width),py=(e.clientY-r.top)*(cv.height/r.height);mx=(px-viewOX)/viewS;my=(py-viewOY)/viewS;});
cv.addEventListener('wheel',e=>{
 if(state!=='car')return;
 e.preventDefault();
 if(gt-carSelWheelT<0.16)return;
 carSelWheelT=gt;
 if(e.deltaY>6||e.deltaX>6)pickCarSel(selCar+1);
 else if(e.deltaY<-6||e.deltaX<-6)pickCarSel(selCar-1);
},{passive:false});
cv.addEventListener('mousedown',e=>{
 if(!AU.ctx)audioInit();
 cv.focus();
 const r=cv.getBoundingClientRect();
 const px=(e.clientX-r.left)*(cv.width/r.width),py=(e.clientY-r.top)*(cv.height/r.height);
 const x=(px-viewOX)/viewS,y=(py-viewOY)/viewS;
 if(state==='intro'){press('Enter');return;}
 if(state==='title'){
  const items=g._titleItems||[];
  const y0=g._titleY0||320,step=g._titleStep||52;
  items.forEach((t,i)=>{const yy=y0+i*step;if(y>yy-24&&y<yy+20&&Math.abs(x-W/2)<220){selTitle=i;press('Enter');}});}
 else if(state==='results')press('Enter');
 else if(state==='garage'&&!garagePaused&&g._gar){for(const b of g._gar)
  if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){tuningSel=b.row;garageAction(0,b.row);break;}}
 else if(state==='char'){
  if(bioOpen>=0){
   if(g._statBtns)for(const b of g._statBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){upgradeCharStat(bioOpen,b.key);sClick();return;}}
   if(g._bioActs)for(const b of g._bioActs){
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){
     if(b.act==='pick')confirmCharPick(bioOpen);
     else bioOpen=-1;
     sClick();return;
    }
   }
   bioOpen=-1;sClick();return;
  }
  if(g._bioBtns)for(const b of g._bioBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){bioOpen=b.idx;sClick();return;}}
 }
 else if(state==='car'&&g._carSel){
  for(let k=g._carSel.length-1;k>=0;k--){
   const b=g._carSel[k];
   if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h)continue;
   if(b.act==='prev'){pickCarSel(selCar-1);return;}
   if(b.act==='next'){pickCarSel(selCar+1);return;}
   if(b.i!=null){pickCarSel(b.i);return;}
  }
 }
 else if(state==='gym'&&g._gymBtns){for(const b of g._gymBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){gymSel=b.idx;buyGym(b.idx);sClick();return;}}}
 else if(state==='autopark'&&g._park){
  for(const b of g._park)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){
   autoparkSel=b.i;
   if(carUnlocked(b.i)){autodetailOpen=true;state='detail';sClick();}
   else sHit();
   return;
  }
 }
 else if(state==='help')enterTitle();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(state==='race'||state==='garage'||state==='title')e.preventDefault();});
addEventListener('popstate',e=>{if(state==='race'){e.preventDefault();history.pushState(null,'',location.href);}});
history.pushState(null,'',location.href);
let last=performance.now(),fpsSmooth=60;
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;gt+=dt;
 fpsSmooth=lerp(fpsSmooth,1/dt,.1);
 if(saveFlash>0)saveFlash-=dt;
 if(garMsgT>0)garMsgT-=dt;
 if(cheatMsgT>0)cheatMsgT-=dt;
 updateView();
 g.setTransform(1,0,0,1,0,0);
 g.fillStyle='#050409';g.fillRect(0,0,cv.width,cv.height);
 if(viewOX>0||viewOY>0){
  const gr=g.createLinearGradient(0,0,0,cv.height);
  gr.addColorStop(0,'#0a0815');gr.addColorStop(1,'#1a1028');
  g.fillStyle=gr;g.fillRect(0,0,cv.width,cv.height);
 }
 g.setTransform(viewS,0,0,viewS,viewOX,viewOY);
 if(state==='results'&&R&&R.msg){R.msg.t+=dt;if(R.msg.t>3.4)R.msg=null;}
 if(state==='race'&&!paused)updRace(dt);
 updEngine(P,paused,state);
 if(CHIP.on)CHIP.pump();
 if(state==='intro'&&!introDone){
  const sc=introScenes()[introFrame];
  if(sc&&introCur<sc.text.length){
   introPrintT+=dt;
   const step=0.028;
   while(introPrintT>=step&&introCur<sc.text.length){
    introPrintT-=step;introCur++;
   }
  }
 }
 if(AU.ctx&&state!=='intro'){const mc=musicCat();if(mc!==lastMusicCat){lastMusicCat=mc;MUSIC.play(mc);}}
 if(state==='title'){
  updateTitleRace(dt);
  drawTitle();
 }
 else if(state==='help')drawHelp();
 else if(state==='achievements')drawAchievements();
 else if(state==='cheats')drawCheats();
 else if(state==='slotSelect')drawSlotSelect();
 else if(state==='settings')drawSettings();
 else if(state==='char'){drawCharSel();if(bioOpen>=0)drawBio();}
 else if(state==='intro')drawIntro();
 else if(state==='car')drawCarSel();
 else if(state==='garage')drawGarage();
 else if(state==='gym')drawGym();
 else if(state==='autopark')drawAutopark();
 else if(state==='detail')drawCarDetail();
 else if(state==='prerace')drawPreRace();
 else if(state==='results')drawResults();
 else if(state==='race'){drawRaceWorld();drawHUD();}
 g.setTransform(1,0,0,1,0,0);
 if(settings.graphics.showFps){
  g.fillStyle='#58ff6b';g.font='12px monospace';
  g.fillText(Math.round(fpsSmooth)+' FPS',10,20);
 }
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
