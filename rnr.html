////////////////////////////////////////////////////////
//
// Стартовая загрузка: реальный прогресс по байтам, без запуска игры
//
////////////////////////////////////////////////////////
const BOOT={ready:false,started:false,giveUp:false,jobs:[],t0:0,vpnShown:false,els:null};
/** Ставит картинку в очередь: пробуем URL по порядку, считаем байты. */
function bootEnqueue(img,urls){
 BOOT.jobs.push({img,urls:(urls||[]).filter(Boolean),got:0,total:0,done:false});
}
/** Удалённый файл (музыка): только прогресс и кэш, без привязки к Image. */
function bootEnqueueFetch(urls){
 BOOT.jobs.push({img:null,urls:(urls||[]).filter(Boolean),got:0,total:0,done:false});
}
function bootEls(){
 if(BOOT.els)return BOOT.els;
 BOOT.els={
  root:document.getElementById('boot-screen'),
  fill:document.getElementById('boot-fill'),
  pct:document.getElementById('boot-pct'),
  status:document.getElementById('boot-status'),
  vpn:document.getElementById('boot-vpn')
 };
 return BOOT.els;
}
/** Доля загрузки: готовые файлы + текущий поток по Content-Length. */
function bootRatio(){
 const n=BOOT.jobs.length;if(!n)return 0;
 let s=0;
 for(const j of BOOT.jobs){
  if(j.done)s+=1;
  else if(j.total>0)s+=Math.min(.99,j.got/j.total);
 }
 return s/n;
}
function bootPaint(){
 const el=bootEls();
 const n=BOOT.jobs.length;
 const done=BOOT.jobs.filter(j=>j.done).length;
 const pct=Math.min(99,Math.floor(bootRatio()*100));
 if(el.fill)el.fill.style.width=pct+'%';
 if(el.pct)el.pct.textContent=pct+'%';
 if(el.status)el.status.textContent=n?('Файлы '+done+' / '+n):'Собираем трассу…';
 if(!BOOT.vpnShown&&BOOT.t0&&performance.now()-BOOT.t0>8000){
  BOOT.vpnShown=true;
  if(el.vpn)el.vpn.classList.add('is-on');
 }
}
function bootMime(url,header){
 const h=(header||'').split(';')[0].trim();
 if(h&&h!=='application/octet-stream')return h;
 if(/\.svg(\?|$)/i.test(url))return 'image/svg+xml';
 if(/\.webp(\?|$)/i.test(url))return 'image/webp';
 if(/\.png(\?|$)/i.test(url))return 'image/png';
 if(/\.jpg|\.jpeg/i.test(url))return 'image/jpeg';
 if(/\.mp3(\?|$)/i.test(url))return 'audio/mpeg';
 return h||'application/octet-stream';
}
async function bootFetchUrl(url,job,signal){
 const res=await fetch(url,{cache:'force-cache',signal});
 // 404 на хосте — сразу следующий URL, без 14 с ожидания Image.onerror
 if(!res.ok)return false;
 const cl=+res.headers.get('Content-Length')||0;
 if(cl)job.total=cl;
 const mime=bootMime(url,res.headers.get('Content-Type'));
 if(!res.body||!res.body.getReader){
  const raw=await res.blob();
  if(!raw||!raw.size)return null;
  const blob=raw.type?raw:new Blob([raw],{type:mime});
  job.got=blob.size;if(!job.total)job.total=blob.size;
  bootPaint();
  return blob;
 }
 const reader=res.body.getReader();
 const chunks=[];
 let got=0;
 while(true){
  const step=await reader.read();
  if(step.done)break;
  chunks.push(step.value);
  got+=step.value.byteLength;
  job.got=got;
  if(!job.total)job.total=got;
  bootPaint();
 }
 const blob=new Blob(chunks,{type:mime});
 if(!blob.size)return null;
 if(!job.total)job.total=got;
 job.got=got;
 bootPaint();
 return blob;
}
async function bootBind(img,blob){
 const href=URL.createObjectURL(blob);
 img.src=href;
 try{if(img.decode)await img.decode();}catch(e){}
}
/** Если fetch недоступен (file://), грузим как обычный Image. */
function bootImgTag(img,url){
 return new Promise(resolve=>{
  const t=setTimeout(()=>done(false),2500);
  const done=ok=>{clearTimeout(t);img.onload=null;img.onerror=null;resolve(ok);};
  img.onload=()=>done(img.naturalWidth>0||/\.svg(\?|$)/i.test(url));
  img.onerror=()=>done(false);
  img.src=url;
 });
}
async function bootRunJob(job){
 if(job.done||BOOT.giveUp){job.done=true;return;}
 const remote=(job.urls||[]).some(u=>/^https?:\/\//i.test(u));
 const fileProto=location.protocol==='file:';
 const ac=typeof AbortController==='function'?new AbortController():null;
 const timer=setTimeout(()=>{if(ac)ac.abort();},remote?4000:8000);
 let netFail=false;
 try{
  for(const url of job.urls){
   if(BOOT.giveUp)break;
   try{
    const blob=await bootFetchUrl(url,job,ac&&ac.signal);
    if(blob===false)continue;
    if(!blob){netFail=true;continue;}
    if(job.img)await bootBind(job.img,blob);
    job.done=true;
    if(job.got<job.total)job.got=job.total;
    bootPaint();
    return;
   }catch(e){netFail=true;}
  }
 }finally{clearTimeout(timer);}
 // Image.src только для file:// или сбоя сети, не для явного 404
 if(job.img&&(fileProto||netFail)&&!BOOT.giveUp){
  for(const url of job.urls){
   if(BOOT.giveUp)break;
   const ok=await bootImgTag(job.img,url);
   if(ok){
    job.done=true;
    if(!job.total){job.total=1;job.got=1;}
    else job.got=job.total;
    bootPaint();
    return;
   }
  }
 }
 job.done=true;
 if(!job.total){job.total=1;job.got=1;}
 bootPaint();
}
async function bootPool(list,limit,fn){
 let i=0;
 const n=Math.max(1,Math.min(limit,list.length||1));
 await Promise.all(Array.from({length:n},async()=>{
  while(i<list.length){const idx=i++;await fn(list[idx]);}
 }));
}
function bootFontsJob(){
 const job={img:null,urls:[],got:0,total:1,done:false};
 BOOT.jobs.push(job);
 return new Promise(resolve=>{
  let done=false;
  const fin=()=>{if(done)return;done=true;job.done=true;job.got=1;bootPaint();resolve();};
  const t=setTimeout(fin,2500);
  const ready=document.fonts&&document.fonts.ready;
  if(ready)ready.then(()=>{clearTimeout(t);fin();}).catch(()=>{clearTimeout(t);fin();});
  else{clearTimeout(t);fin();}
 });
}
function bootFinish(){

 BOOT.giveUp=true;

  try{initTitleRace();}catch(e){console.error(e);titleSim=null;}
  requestAnimationFrame(frame);

}
async function bootGo(){
 if(BOOT.started)return;
 BOOT.started=true;
 BOOT.t0=performance.now();

 const tick=setInterval(bootPaint,250);
 const dog=setTimeout(()=>bootFinish(),8000);
 try{

  }
 }catch(e){console.error(e);}
 finally{clearInterval(tick);clearTimeout(dog);}
 bootFinish();
}

// Перенос подписи по ширине карточки

function wrapText(c,text,x,y,maxW,lineH,size,col,font){
 c.font=size+'px '+font;c.textAlign='center';c.textBaseline='middle';c.fillStyle=col;
 const words=text.split(' ');let line='';let yy=y;
 for(const w of words){
  const test=line?line+' '+w:w;
  if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lineH;}
  else line=test;
 }
 if(line)c.fillText(line,x,yy);
 return yy;
}
////////////////////////////////////////////////////////
//
// Перенос текста в массив строк (слово, затем символ)
//
////////////////////////////////////////////////////////
function layoutLines(c,text,maxW,size,font){
 c.font=size+'px '+font;
 const words=String(text||'').split(/\s+/).filter(Boolean);
 const lines=[];
 let line='';
 const flush=()=>{if(line){lines.push(line);line='';}};
 const fit=(chunk)=>{
  if(c.measureText(chunk).width<=maxW)return chunk;
  let keep='';
  for(const ch of chunk){
   if(keep&&c.measureText(keep+ch).width>maxW){lines.push(keep);keep=ch;}
   else keep+=ch;
  }
  return keep;
 };
 for(const w of words){
  const test=line?line+' '+w:w;
  if(c.measureText(test).width<=maxW){line=test;continue;}
  flush();
  line=fit(w);
 }
 flush();
 return lines.length?lines:[''];
}

function drawAnnounceToast(c,msg,cx,top,viewWidth){
 if(!msg||!msg.txt)return;
 const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const a=reduce?1:(msg.t<.25?msg.t/.25:msg.t>2.9?clamp((3.4-msg.t)/.5,0,1):1);
 if(a<=0)return;
 const big=!!msg.big;
 const size=big?18:15;
 const lineH=big?22:19;
 const labelH=14;
 const padX=28;
 const padY=14;
 const maxW=Math.min(big?560:500,Math.max(300,viewWidth-380));
 const inner=Math.max(140,maxW-padX*2-8);
 const raw=layoutLines(c,msg.txt,inner,size,F_D);
 const shown=raw.slice(0,3);
 if(raw.length>3){
  let last=shown[2];
  while(last.length>1&&c.measureText(last+'…').width>inner)last=last.slice(0,-1);
  shown[2]=last+'…';
 }
 const textW=shown.reduce((m,l)=>Math.max(m,c.measureText(l).width),0);
 const w=clamp(textW+padX*2+8,220,maxW);
 const h=padY+labelH+shown.length*lineH+padY+2;
 const x=cx-w/2,y=top;
 c.save();
 c.globalAlpha=a;
 rr(c,x,y,w,h,10);
 c.fillStyle='rgba(16,12,22,.94)';c.fill();
 c.strokeStyle='#ff9d2e';c.lineWidth=2;c.stroke();
 c.beginPath();
 if(c.roundRect)c.roundRect(x,y,w,h,10);
 else rr(c,x,y,w,h,10);
 c.clip();
 c.fillStyle='rgba(255,157,46,.16)';
 c.fillRect(x,y,5,h);
 txt(c,'ЭФИР',x+padX,y+padY+labelH/2,11,'#ff9d2e','left',F_B,false);
 const life=clamp(1-msg.t/3.4,0,1);
 c.fillStyle='rgba(255,157,46,.45)';
 c.fillRect(x+padX,y+padY+labelH-2,Math.max(24,(w-padX*2)*life),2);
 const ty=y+padY+labelH+lineH/2;
 shown.forEach((line,i)=>txt(c,line,x+padX,ty+i*lineH,size,'#ffd23f','left',F_D));
 c.restore();
}

function introScenes(){

/** Обрезка чёрных полей, которые зашиты в кадры комикса. */
function introCrop(img){
 if(img._crop)return img._crop;
 const w=img.naturalWidth,h=img.naturalHeight;
 if(!w||!h)return{sx:0,sy:0,sw:1,sh:1};
 const full={sx:0,sy:0,sw:w,sh:h};
 const tc=document.createElement('canvas');
 tc.width=w;tc.height=h;
 const tg=tc.getContext('2d',{willReadFrequently:true});
 if(!tg){img._crop=full;return full;}
 tg.drawImage(img,0,0);
 let data;
 try{data=tg.getImageData(0,0,w,h).data;}catch(e){img._crop=full;return full;}
 const isBar=(px)=>{
  const r=data[px],gch=data[px+1],b=data[px+2],a=data[px+3];
  return a<8||(r<8&&gch<8&&b<10);
 };
 let x0=0,x1=w-1,y0=0,y1=h-1;
 scanL:for(;x0<w;x0++){for(let y=0;y<h;y++)if(!isBar((y*w+x0)<<2))break scanL;}
 scanR:for(;x1>x0;x1--){for(let y=0;y<h;y++)if(!isBar((y*w+x1)<<2))break scanR;}
 scanT:for(;y0<h;y0++){for(let x=x0;x<=x1;x++)if(!isBar((y0*w+x)<<2))break scanT;}
 scanB:for(;y1>y0;y1--){for(let x=x0;x<=x1;x++)if(!isBar((y1*w+x)<<2))break scanB;}
 const sw=x1-x0+1,sh=y1-y0+1;
 img._crop=(sw<w*0.35||sh<h*0.35)?full:{sx:x0,sy:y0,sw:sw,sh:sh};
 return img._crop;
}

/** Чинит потерянный флаг руля: передние колёса — те, что ближе к носу (+X). */
function repairEditorSteer(cfg){
 if(!cfg||!Array.isArray(cfg.w)||!cfg.w.length)return;
 const list=cfg.w;
 const xs=list.map(w=>+w[0]||0);
 const lo=Math.min.apply(null,xs),hi=Math.max.apply(null,xs);
 const mid=(lo+hi)/2;
 if(list.some(w=>w&&+w[6]&&(+w[0]||0)>=mid))return;
 list.forEach((w,i)=>{
  if(!Array.isArray(w))return;
  while(w.length<7)w.push(0);
  w[6]=(hi-lo<1)?(i>=list.length-2?1:0):((+w[0]||0)>=mid?1:0);
 });
}

/**
 * Перекрытие двух рамок. MTV: единичный вектор от A к B и глубина.
 * null — нет пересечения.
 */
function obbOverlap(A,B){
 const dx=B.cx-A.cx,dy=B.cy-A.cy;
 const span=Math.hypot(A.hw,A.hh)+Math.hypot(B.hw,B.hh);
 if(dx*dx+dy*dy>span*span)return null;
 const axes=[[A.ca,A.sa],[-A.sa,A.ca],[B.ca,B.sa],[-B.sa,B.ca]];
 let pen=1e9,nx=1,ny=0;
 for(let i=0;i<4;i++){
  const ax=axes[i][0],ay=axes[i][1];
  const rA=A.hw*Math.abs(ax*A.ca+ay*A.sa)+A.hh*Math.abs(ax*(-A.sa)+ay*A.ca);
  const rB=B.hw*Math.abs(ax*B.ca+ay*B.sa)+B.hh*Math.abs(ax*(-B.sa)+ay*B.ca);
  const d=dx*ax+dy*ay,ov=rA+rB-Math.abs(d);
  if(ov<=0)return null;
  if(ov<pen){
   pen=ov;
   const s=d<0?-1:1;
   nx=ax*s;ny=ay*s;
  }
 }
 if(!(nx||ny)){nx=dx||1;ny=dy;}
 const len=Math.hypot(nx,ny)||1;
 return{nx:nx/len,ny:ny/len,pen};
}

const MAP_TILES={};

const MAP_TILE_MAX=32;
/** Регистрирует биом: кадры 01.webp… ищем при boot, не пачкой «на 32 вперёд». */
function loadMapTiles(biome){
 if(!biome||MAP_TILE_BIOMES.indexOf(biome)>=0)return;
 MAP_TILE_BIOMES.push(biome);
 MAP_TILES[biome]=[];
}

/**
 * Ищем 01.webp / 01.png, 02… Потолок MAP_TILE_MAX.
 * Две дырки подряд — стоп (01 и 03 подхватятся, 01 без 02 и 03 — только единица).
 */
async function bootDiscoverMapTiles(biome){
 const list=[];
 let miss=0;
 for(let i=1;i<=MAP_TILE_MAX;i++){
  if(BOOT.giveUp)break;
  const n=String(i).padStart(2,'0');
  const base='assets/image/textures/map/'+biome+'/'+n;
  const img=new Image();
  const job={img,urls:[base+'.webp',base+'.png'],got:0,total:0,done:false};
  BOOT.jobs.push(job);
  bootPaint();
  await bootRunJob(job);
  if(img.complete&&img.naturalWidth>0){list.push(img);miss=0;continue;}
  const ix=BOOT.jobs.indexOf(job);
  if(ix>=0)BOOT.jobs.splice(ix,1);
  bootPaint();
  miss++;
  if(miss>=2)break;
 }
 MAP_TILES[biome]=list;
}
async function bootDiscoverAllMapTiles(){
 await Promise.all(MAP_TILE_BIOMES.map(b=>bootDiscoverMapTiles(b)));
}
// Шаг клетки в мире — 256. Кэш 512: хватает на зум 2.25, без фильтрации 1000px каждый кадр
const MAP_TILE_CELL=256;
const MAP_TILE_CACHE=512;
/** Живые картинки биома: только complete и с шириной, битые кадры не в сетку. */
function mapTileList(biome){
 return (MAP_TILES[biome]||[]).filter(im=>im.complete&&im.naturalWidth>0);
}
/** Один случайный кадр из папки: 01 или 02 или любой другой — на весь заезд. */
function pickMapTile(biome){
 const tiles=mapTileList(biome);
 if(!tiles.length)return null;
 return tiles[(Math.random()*tiles.length)|0];
}
/** Сжимаем исходник один раз в 512 px — дальше в кадре только этот холст. */
function bakeMapTile(img){
 const c=document.createElement('canvas');
 c.width=c.height=MAP_TILE_CACHE;
 const q=c.getContext('2d');
 q.imageSmoothingEnabled=true;
 if(q.imageSmoothingQuality)q.imageSmoothingQuality='medium';
 q.drawImage(img,0,0,MAP_TILE_CACHE,MAP_TILE_CACHE);
 return c;
}
/** Повтор запечённого кадра: шаг 256 в мире, без high-quality по полному файлу. */
function fillMapTileWorld(x,y,w,h,T){
 if(!T.pat){
  g.fillStyle=(T.theme&&T.theme.ground)||'#3a2a20';
  g.fillRect(x,y,w,h);
  return;
 }
 const src=T.mapBake||T.mapTile;
 const nw=(src&&(src.width||src.naturalWidth))||MAP_TILE_CELL;
 const s=MAP_TILE_CELL/nw;
 g.save();
 g.imageSmoothingEnabled=true;
 if(g.imageSmoothingQuality)g.imageSmoothingQuality='medium';
 g.scale(s,s);
 g.fillStyle=T.pat;
 g.fillRect(x/s,y/s,w/s,h/s);
 g.restore();
}

  .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];};

function placeTrackHazards(T,seed){

  for(let j=0;j<N;j+=6){if(Math.abs(((j-idx+N+N/2)%N)-N/2)<50)continue;
   if(Math.hypot(S[j].x-p.x,S[j].y-p.y)<180)return false;}return true;};
 for(const o of straight){ if(ramps.length>=3)break;
  if(!crossOK(o.i))continue;
  if(ramps.every(q=>Math.abs(q.i-o.i)>60&&Math.abs(q.i-o.i)<N-60))
   ramps.push({i:o.i,x:S[o.i].x,y:S[o.i].y,ang:S[o.i].ang});
 }
 const mid=byK.filter(o=>o.k>.004&&o.k<.012&&valid(o.i));
 for(let j=0;j<8&&mid.length;j++){const o=mid[(Rz()*mid.length)|0];
  if(mines.every(m=>Math.abs(m.i-o.i)>26))mines.push({i:o.i,lat:(Rz()*2-1)*(ROADW-40)});}
 for(let j=0;j<6;j++){const i=80+((Rz()*(N-160))|0);if(oils.every(o=>Math.abs(o.i-i)>30))oils.push({i,lat:(Rz()*2-1)*(ROADW-36),rot:Rz()*TAU});}

 for(const o of oils){const p=S[o.i];o.x=p.x+p.nx*o.lat;o.y=p.y+p.ny*o.lat;}
 for(const pd of pads){const p=S[pd.i];pd.x=p.x;pd.y=p.y;pd.ang=p.ang;pd.cool=0;}
 const types=['money','money','money','money','money','money','money','wrench','wrench','wrench','wrench','wep','wep','wep','wep','ult','ult','ult','nit','nit','nit','shield','shield','bolt','bolt','ult','ult','ult','ult','ult'];

}

function stepVehicle(r,th,steer,dt){

 let mult=1;if(r.bolt>0)mult*=1.3;
 if(r.nitro>0)mult*=(r.car.idx===1?1.6:1.45);

 let top=r.st.top*(off?r.st.off:1)*mult;
 if(!r.isP){
  top*=1+.05*Math.min(3,(R.div||1)-1);
  const deficit=(P&&R.N)?(P.prog-r.prog)/R.N:0;top*=1+clamp(deficit*.4,-.06,.1);}

 const rate=th===0?240:620;

 else r.spd+=clamp(tgt-r.spd,-rate*dt,rate*dt);
 if(th===0)r.spd*=Math.max(0,1-1.1*dt);
 if(r.finished)r.spd*=Math.max(0,1-3*dt); // после финиша резко тормозим

 const ad=r.ang-oldAng;

 if(!r.car.hov&&!r.air&&(drift>3&&Math.abs(r.spd)>100||(r.finished&&Math.abs(steer)>0.2&&Math.abs(r.spd)>40))&&settings.graphics.skids){
  const wx1=r.x-Math.cos(r.ang)*14-Math.sin(r.ang)*14;
  const wy1=r.y-Math.sin(r.ang)*14+Math.cos(r.ang)*14;
  const wx2=r.x-Math.cos(r.ang)*14+Math.sin(r.ang)*14;
  const wy2=r.y-Math.sin(r.ang)*14-Math.cos(r.ang)*14;
  const prev=R.skids.length>0?R.skids[R.skids.length-1]:null;
  R.skids.push({
   lx:wx1,ly:wy1,rx:wx2,ry:wy2,
   plx:prev?prev.lx:wx1,ply:prev?prev.ly:wy1,
   prx:prev?prev.rx:wx2,pry:prev?prev.ry:wy2,
   ang:r.ang,t:6
  });
  if(R.skids.length>800)R.skids.shift();
 }
 let oil=false;for(const o of R.oils)if(Math.hypot(r.x-o.x,r.y-o.y)<34){oil=true;break;}
 if(oil&&!r.air&&r.car.idx!==3)r.ang+=Math.sin(gt*14+r.slot*3)*2.4*dt;
 // Скольжение на льду
 if(R.T.theme.deco==='ice'&&!r.air&&r.car.idx!==3){
  const slip=Math.sin(gt*8+r.slot*2)*1.8*dt;
  r.ang+=slip*(Math.abs(r.spd)/r.st.top);
 }
 // Погода
 if(settings.graphics.weather&&R.weather.parts>0&&r.car.idx!==3){
  const slip=Math.sin(gt*12+r.slot*3)*(1-R.weather.mod)*2*dt;
  r.ang+=slip*(Math.abs(r.spd)/r.st.top);
 }
 if(r.car.idx===2)r.hp=Math.min(r.maxhp,r.hp+2*dt);
 if(r.chIdx===0){const ht=skillVal(0,r.skillLvl);r.hp=Math.min(r.maxhp,r.hp+(r.maxhp/ht)*dt);}
 r.x+=Math.cos(r.ang)*r.spd*dt;r.y+=Math.sin(r.ang)*r.spd*dt;
 r.x=clamp(r.x,20,R.T.w-20);r.y=clamp(r.y,20,R.T.h-20);
 // ТРАМПЛИН: прыжок. Высота/дальность зависят от скорости (баланс).
 if(!r.air){
  for(const rp of R.ramps){
   if(Math.hypot(r.x-rp.x,r.y-rp.y)<46&&Math.abs(r.spd)>140){

/** Руль из лаборатории: флаг [6] на носу; если флаг потерян — колёса с большим +X. */
function editorWheelSteers(q,i,list){
 if(!q||!list||!list.length)return false;
 const xs=list.map(w=>+w[0]||0);
 const lo=Math.min.apply(null,xs),hi=Math.max.apply(null,xs);
 const mid=(lo+hi)/2;
 const flagsOnFront=list.some(w=>w&&+w[6]&&(+w[0]||0)>=mid);

}

let hudFx=null;
function hudMotionOk(){return !introReduceMotion;}
function hudLerp(a,b,k){return a+(b-a)*k;}
function resetHudFx(){
 hudFx={place:-1,pop:0,lap:-1,lapFlash:0,hp:1,spd:0,rowY:{},ready:[0,0,0],prevCd:[1,1,1],t:gt};
}
function tickHudFx(){
 if(!R||!P)return;
 if(!hudFx)resetHudFx();
 const fx=hudFx,dt=Math.min(.05,Math.max(.001,gt-(fx.t||gt))),mot=hudMotionOk();
 fx.t=gt;
 const place=R.order.indexOf(P)+1;
 if(fx.place<0)fx.place=place;
 if(place!==fx.place){fx.pop=1;fx.place=place;}
 fx.pop=Math.max(0,fx.pop-dt*2.8);
 const lap=clamp(P.lap+1,1,raceLaps);
 if(fx.lap<0)fx.lap=lap;
 if(lap!==fx.lap){fx.lapFlash=1;fx.lap=lap;}
 fx.lapFlash=Math.max(0,fx.lapFlash-dt*1.6);
 const hpT=clamp(P.hp/P.maxhp,0,1);
 fx.hp=mot?hudLerp(fx.hp,hpT,.2):hpT;
 const spdT=Math.abs(P.spd)*.45;
 fx.spd=mot?hudLerp(fx.spd,spdT,.24):spdT;
 R.order.forEach((r,i)=>{
  const id=R.racers.indexOf(r);
  const y=i*32;
  fx.rowY[id]=fx.rowY[id]==null?y:(mot?hudLerp(fx.rowY[id],y,.24):y);
 });
 [P.cdW,P.cdN,P.cdU].forEach((cd,i)=>{
  const busy=i===0&&wepMagMax(P)>0?(P.wepOver>0):cd>0.05;
  if(fx.prevCd[i]>0.05&&!busy)fx.ready[i]=1;
  fx.prevCd[i]=busy?1:0;
  fx.ready[i]=Math.max(0,fx.ready[i]-dt*1.35);
 });
}

function drawHudMinimap(c,px0,py0,pw,ph){
 const th=R.T.theme,mp=R.map.pts;
 const pad=20;
 const mw=R.map.mw||1,mh=R.map.mh||1;
 const sc=Math.min((pw-pad*2)/mw,(ph-pad*2)/mh);
 const mox=px0+(pw-mw*sc)/2,moy=py0+(ph-mh*sc)/2;
 const roadW=clamp(ROADW*R.map.ms*sc*.55,5,11);
 c.save();
 panelPath(c,px0,py0,pw,ph,12);
 c.clip();
 const dirt=c.createLinearGradient(px0,py0,px0+pw,py0+ph);
 dirt.addColorStop(0,th.dark||'#2a2018');
 dirt.addColorStop(.45,th.ground||'#3a2a20');
 dirt.addColorStop(1,th.dark||'#1a1410');
 c.fillStyle=dirt;c.fillRect(px0,py0,pw,ph);
 const trackPath=()=>{
  c.beginPath();
  c.moveTo(mox+mp[0][0]*sc,moy+mp[0][1]*sc);
  for(let i=1;i<mp.length;i++)c.lineTo(mox+mp[i][0]*sc,moy+mp[i][1]*sc);
  c.closePath();
 };
 c.lineJoin='round';c.lineCap='round';
 trackPath();c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=roadW+5;c.stroke();
 trackPath();c.strokeStyle=th.road||'#3c3a42';c.lineWidth=roadW;c.stroke();
 trackPath();c.strokeStyle=th.line||'#d9c49a';c.lineWidth=Math.max(1.2,roadW*.18);c.setLineDash([5,4]);c.stroke();c.setLineDash([]);
 const p0=mp[0],p1=mp[1]||mp[0];
 const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy)||1;
 const nx=-dy/len,ny=dx/len,hw=roadW*.55;
 const fx=mox+p0[0]*sc,fy=moy+p0[1]*sc;
 c.strokeStyle='#f4f0e4';c.lineWidth=2.4;
 c.beginPath();c.moveTo(fx-nx*hw,fy-ny*hw);c.lineTo(fx+nx*hw,fy+ny*hw);c.stroke();
 const blot=(list,col,sz)=>{
  c.fillStyle=col;
  for(const o of list){
   if(o.dead||o.alive===false)continue;
   const p=hudMapXY(o.x,o.y,mox,moy,sc);
   c.beginPath();c.arc(p[0],p[1],sz,0,TAU);c.fill();
  }
 };
 blot(R.mines,'rgba(255,61,46,.9)',2.2);
 blot(R.pads,'rgba(53,224,255,.9)',2.4);
 blot(R.ramps,'rgba(125,249,255,.95)',3);
 blot(R.picks.filter(p=>p.alive),'rgba(255,210,63,.85)',2);
 for(const r of R.racers){
  if(r.dead||r.isP)continue;
  const p=hudMapXY(r.x,r.y,mox,moy,sc);
  c.fillStyle='#0c0a12';c.beginPath();c.arc(p[0],p[1],4.2,0,TAU);c.fill();
  c.fillStyle=r.aiCol||'#e8e2d0';c.beginPath();c.arc(p[0],p[1],3,0,TAU);c.fill();
 }
 if(!P.dead){
  const p=hudMapXY(P.x,P.y,mox,moy,sc);
  const pulse=hudMotionOk()?1+Math.sin(gt*8)*.14:1;
  c.save();c.translate(p[0],p[1]);c.rotate(P.ang);c.scale(pulse,pulse);
  c.fillStyle='#0c0a12';
  c.beginPath();c.moveTo(8,0);c.lineTo(-5.5,-5.5);c.lineTo(-5.5,5.5);c.closePath();c.fill();
  c.fillStyle='#ffd23f';
  c.beginPath();c.moveTo(6.5,0);c.lineTo(-4,-4.2);c.lineTo(-4,4.2);c.closePath();c.fill();
  c.restore();
 }
 c.restore();
 panel(c,px0,py0,pw,ph,null,'#ff9d2e',12);
}

/** RGB из #hex для заливок сцены пилота. */
function hexToRgb(hex){
 const s=String(hex||'#c8b070').replace('#','');
 const n=parseInt(s.length===3?s.replace(/./g,'$&$&'):s,16);
 if(isNaN(n))return[200,176,112];
 return[(n>>16)&255,(n>>8)&255,n&255];
}
function drawPortrait(c,ch,cx,cy,s){
 const img=avatarImage(ch);
 c.save();
 c.translate(cx,cy);
 const k=s*2;
 c.scale(k,k);
 if(img){
  c.drawImage(img,-44,-44,88,88);
 }else if(ch){
  c.fillStyle=ch.col||'#3a3548';rr(c,-30,-34,60,68,8);c.fill();
  c.fillStyle=ch.skin||'#eab98a';rr(c,-16,-26,32,38,10);c.fill();
  c.fillStyle=ch.hair||'#2b2119';c.fillRect(-17,-30,34,12);
  c.fillStyle='#1a1622';c.fillRect(-11,-10,7,5);c.fillRect(4,-10,7,5);
 }
 c.restore();
}

/** Рисует NN_Player_fullbody, вписанный по высоте, ноги к низу кадра. */
function drawFullbodyFit(c,img,x,y,w,h){
 const iw=img.naturalWidth,ih=img.naturalHeight;
 const sc=Math.min(w/iw,h/ih);
 const dw=iw*sc,dh=ih*sc;
 c.drawImage(img,x+(w-dw)/2,y+h-dh,dw,dh);
}

////////////////////////////////////////////////////////
//
// VHS-наложение: строки, зерно, дорожка, редкий сдвиг полосы
// Меню — на весь кадр; интро — только панель комикса. box в пикселях холста.
// Сниженный motion — статичные строки и виньетка.
//
////////////////////////////////////////////////////////
let vhsScan=null,vhsGrain=null,vhsBuf=null,vhsBufCtx=null;
/** Паттерны скана и зерна — один раз. */
function vhsEnsure(){
 if(!vhsScan){
  vhsScan=document.createElement('canvas');vhsScan.width=2;vhsScan.height=4;
  const s=vhsScan.getContext('2d');
  s.fillStyle='rgba(0,0,0,.42)';s.fillRect(0,2,2,1);
  s.fillStyle='rgba(255,255,255,.05)';s.fillRect(0,0,2,1);
 }
 if(!vhsGrain){
  vhsGrain=document.createElement('canvas');vhsGrain.width=vhsGrain.height=96;
  const n=vhsGrain.getContext('2d'),id=n.createImageData(96,96),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=40+((Math.random()*180)|0);d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  n.putImageData(id,0,0);
 }
 if(!vhsBuf){vhsBuf=document.createElement('canvas');vhsBufCtx=vhsBuf.getContext('2d');}
}
/** Снимок прямоугольника холста в буфер того же размера. */
function vhsGrabRect(x,y,w,h){
 vhsEnsure();
 const bw=Math.max(1,Math.round(w)),bh=Math.max(1,Math.round(h));
 if(vhsBuf.width!==bw||vhsBuf.height!==bh){vhsBuf.width=bw;vhsBuf.height=bh;}
 vhsBufCtx.setTransform(1,0,0,1,0,0);
 vhsBufCtx.drawImage(cv,x,y,w,h,0,0,bw,bh);
}
/**
 * VHS поверх области. Без box — видимая сцена меню (логическое 1280×720).
 */
function drawVhsOverlay(box){
 vhsEnsure();
 const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const light=settings.graphics.particles==='low';
 const x=box?box.x:viewOX;
 const y=box?box.y:viewOY;
 const w=box?box.w:W*viewS;
 const h=box?box.h:H*viewS;
 const ox=Math.max(1,w/800);
 const barH=Math.max(8,h*0.02);
 g.save();
 g.setTransform(1,0,0,1,0,0);
 g.beginPath();
 if(box&&box.r>0)rr(g,x,y,w,h,box.r);
 else g.rect(x,y,w,h);
 g.clip();
 if(!reduce&&!light){
  vhsGrabRect(x,y,w,h);
  g.globalCompositeOperation='screen';
  g.globalAlpha=.11;
  g.drawImage(vhsBuf,x+ox*1.6,y,w,h);
  g.globalAlpha=.09;
  g.drawImage(vhsBuf,x-ox*1.4,y+ox*.4,w,h);
  g.globalCompositeOperation='source-over';
  const beat=(Math.sin(gt*2.15)+Math.sin(gt*7.3))*0.5;
  if(beat>0.72){
   const ly=((gt*83)%h)|0,hh=6+((gt*19)%22)|0,dx=10*Math.sin(gt*31)*ox;
   g.drawImage(vhsBuf,0,ly,w,hh,x+dx,y+ly,w,hh);
  }
 }
 g.globalAlpha=reduce?.22:.38;
 g.fillStyle=g.createPattern(vhsScan,'repeat');
 g.fillRect(x,y,w,h);
 if(!reduce){
  g.save();
  g.globalAlpha=light?.05:.09;
  g.globalCompositeOperation='overlay';
  g.translate(-((gt*70)%96),-((gt*41)%96));
  g.fillStyle=g.createPattern(vhsGrain,'repeat');
  g.fillRect(x-96,y-96,w+192,h+192);
  g.restore();
  const bar=y+((gt*48)%(h+36))-18;
  g.globalCompositeOperation='source-over';
  g.globalAlpha=.1;
  const band=g.createLinearGradient(0,bar,0,bar+barH);
  band.addColorStop(0,'rgba(180,255,210,0)');
  band.addColorStop(.45,'rgba(200,255,220,.55)');
  band.addColorStop(1,'rgba(180,255,210,0)');
  g.fillStyle=band;g.fillRect(x,bar,w,barH);
 }
 g.globalCompositeOperation='source-over';
 g.globalAlpha=1;
 const vg=g.createRadialGradient(x+w/2,y+h*.46,h*.18,x+w/2,y+h*.5,h*.78);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,'rgba(6,4,10,.58)');
 g.fillStyle=vg;g.fillRect(x,y,w,h);
 g.globalAlpha=.05;g.fillStyle='#2a4a32';g.fillRect(x,y,w,h);
 g.restore();
}
/** VHS в логических координатах сцены (гараж / выбор машины). */
function drawVhsView(x,y,w,h,rad){
 drawVhsOverlay({x:viewOX+x*viewS,y:viewOY+y*viewS,w:w*viewS,h:h*viewS,r:(rad||0)*viewS});
}

/** Сдвиг опции графики: стрелки, клик, колесо. */
function nudgeGraphics(dir){
 const opt=gfxOpts()[settingsTab];
 if(!opt||opt.type==='back')return false;
 if(opt.type==='zoom')nudgeCameraZoom(dir);
 else if(opt.type==='res'){
  const n=RESOLUTIONS.length,cur=settings.graphics.resolution||0;
  settings.graphics.resolution=dir>0?(cur+1)%n:(cur+n-1)%n;
  applyResolution();
  saveSettings();
 }else if(opt.type==='enum'){
  const vals=opt.values,idx=vals.indexOf(settings.graphics[opt.key]);
  const n=vals.length;
  settings.graphics[opt.key]=vals[dir>0?(idx+1)%n:(idx+n-1)%n];
  saveSettings();
 }else if(opt.type==='bool'){
  settings.graphics[opt.key]=!settings.graphics[opt.key];
  saveSettings();
 }
 return true;
}
function nudgeSound(dir){
 const opt=sndOpts()[settingsTab];
 if(!opt||opt.type==='back')return false;
 if(opt.type==='vol'){
  settings.sound[opt.key]=clamp(settings.sound[opt.key]+dir*10,0,100);
  if(AU.ctx){
   if(opt.key==='music')applyAudioSettings();
   else AU.sfx.gain.value=settings.sound.sfx/100*.9;
  }
 }else if(opt.type==='bool'){
  settings.sound[opt.key]=!settings.sound[opt.key];
  if(opt.key==='musicOn'&&AU.ctx)applyAudioSettings();
 }
 saveSettings();
 return true;
}

 }
}

/** Позиция плитки трассы в сетке. */
function trackTileRect(i){
 const n=TRACKDEFS.length,cols=3,tw=360,th=196,gap=20;
 const row=(i/cols)|0,inRow=Math.min(cols,n-row*cols),col=i%cols;
 const rowW=inRow*tw+(inRow-1)*gap;
 return{x:(W-rowW)/2+col*(tw+gap),y:148+row*(th+gap),w:tw,h:th};
}
/** Контур трассы по контрольным точкам. */
function drawTrackOutline(c,def,x,y,w,h){
 const cps=def.cps;if(!cps||!cps.length)return;
 let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
 for(const p of cps){minx=Math.min(minx,p[0]);miny=Math.min(miny,p[1]);maxx=Math.max(maxx,p[0]);maxy=Math.max(maxy,p[1]);}
 const pad=18,bw=w-pad*2,bh=h-pad*2-36;
 const sc=Math.min(bw/Math.max(1,maxx-minx),bh/Math.max(1,maxy-miny));
 const ox=x+w/2-((minx+maxx)/2)*sc,oy=y+pad+8+bh/2-((miny+maxy)/2)*sc;
 const th=def.theme||{};
 c.save();
 c.strokeStyle=th.line||'#ffd23f';c.lineWidth=7;c.lineJoin='round';c.lineCap='round';
 c.beginPath();
 cps.forEach((p,i)=>{const px=ox+p[0]*sc,py=oy+p[1]*sc;if(i)c.lineTo(px,py);else c.moveTo(px,py);});
 c.closePath();c.stroke();
 c.strokeStyle=th.road||'#3a3548';c.lineWidth=3.5;c.stroke();
 c.restore();
}

function carPreviewAnim(){

/** Урал длиннее: для карточек чуть жмём, в боксе превью считаем габарит. */
function previewCarScale(car){
 return car&&car.idx===6?0.72:1;
}
/** Габарит машины в игровых единицах (нос вправо) для вписывания в рамку. */
function previewCarBounds(car){
 const idx=car&&car.idx|0;
 const cfg=editorCarConfig(idx);
 const bodyS=carBodyScale(idx);
 let w=idx===6?108:70,h=idx===6?44:38;
 w=Math.max(w,62*bodyS);h=Math.max(h,34*bodyS);
 if(cfg&&cfg.body){
  w+=Math.abs(+cfg.body.x||0)*2;
  h+=Math.abs(+cfg.body.y||0)*2;
 }
 (cfg&&cfg.w||[]).forEach((q)=>{
  if(!q)return;
  const sc=q[5]!=null&&+q[5]>0?+q[5]:1;
  const dw=Math.max(0.4,(isFinite(+q[2])?+q[2]:12)*sc);
  const dh=Math.max(0.4,(isFinite(+q[3])?+q[3]:8)*sc);
  w=Math.max(w,Math.abs(+q[0]||0)*2+dw+4);
  h=Math.max(h,Math.abs(+q[1]||0)*2+dh+4);
 });
 return{w,h};
}
/** Масштаб превью: целиком влезает по ширине и высоте бокса. */
function previewFitScale(car,boxW,boxH){
 const b=previewCarBounds(car);
 return Math.min((boxW*0.84)/b.w,(boxH*0.68)/b.h);
}
/** Машина в боксе превью: дорога и вращение колёс. */
function drawDrivingCarPreview(c,cx,cy,boxW,boxH,car,ch){
 const a=carPreviewAnim();
 c.save();
 c.translate(cx,cy+a.bob);
 drawPreviewRoad(boxW,boxH,a.drive,0);
 const sc=previewFitScale(car,boxW,boxH);
 c.scale(sc,sc);
 drawCar(c,{x:0,y:0,ang:0,car,ch,nitro:0,wheelRot:a.wr,wheelAngle:a.wa},1);
 c.restore();
}

function resultsEaseOut(t){t=clamp(t,0,1);return 1-Math.pow(1-t,3);}
function resultsSnap(t){
 t=clamp(t,0,1);
 const c=1.55;
 return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);
}
function drawResultCard(c,r,placeIdx,x,y,w,h,age,reduce){
 const pl=r===P;
 const av=Math.min(118,h-10);
 const ink=placeIdx===0?'#ffd23f':placeIdx===1?'#d8d4e0':placeIdx===2?'#e09a5a':'#9a93a8';
 const bodyX=x+av+16,bodyW=w-av-16;
 const aAv=reduce?1:resultsEaseOut(age/0.28);
 const aInfo=reduce?1:resultsEaseOut((age-0.12)/0.28);
 const aStat=reduce?1:resultsEaseOut((age-0.26)/0.24);
 const aTalk=reduce?1:resultsEaseOut((age-0.42)/0.22);
 const slide=reduce?0:(1-aAv)*48;
 const sc=reduce?1:0.72+0.28*resultsSnap(age/0.34);
 c.save();
 if(pl&&aInfo>0.04){
  c.globalAlpha=aInfo;
  rr(c,bodyX,y,bodyW,h,12);
  c.fillStyle='rgba(255,210,63,.09)';c.fill();
  c.fillStyle='#ffd23f';
  c.fillRect(bodyX,y+10,3,h-20);
 }
 c.globalAlpha=aAv;
 c.save();
 c.translate(x+av/2-slide,y+h/2);
 c.scale(sc,sc);
 drawLeaderAvatar(c,r.ch,0,0,av,1.28);
 c.restore();
 c.globalAlpha=aInfo;
 txt(c,String(placeIdx+1),bodyX+22,y+22,22,ink,'center',F_D,false);
 txt(c,racerTag(r),bodyX+42,y+22,pl?22:19,pl?'#ffd23f':'#e8e2d0','left',F_B,false);
 txt(c,carTitle(r),bodyX+42,y+44,13,'#8a8498','left',F_B,false);
 const tm=r.finished?fmtT(r.finishTime):'СНЯТ';
 const pz=R.prize[placeIdx]>0?('+$'+R.prize[placeIdx]+(placeIdx===3?' утеш.':'')):'—';
 txt(c,tm,x+w-20,y+20,16,pl?'#ffd23f':'#c8c2d4','right',F_B,false);
 txt(c,pz,x+w-20,y+42,17,R.prize[placeIdx]>0?'#58ff6b':'#5a5468','right',F_D,false);
 c.globalAlpha=aStat;
 const bits=[['УР',String(Math.round(r.dmgDealt||0))],['ФР',String(r.kills||0)],['ПР',String(r.jumps||0)],['ЯЩ',String(r.pickups||0)],['КР',r.bestLap?fmtT(r.bestLap):'—']];
 let sx=bodyX+42;
 bits.forEach(b=>{
  txt(c,b[0],sx,y+64,10,'#5a5468','left',F_B,false);

  sx+=78;
 });
 const cap=(R.announcerByPlace&&R.announcerByPlace[placeIdx])||'';
 if(cap&&aTalk>0.02){
  c.globalAlpha=aTalk;
  const raw=pl?cap:(racerTag(r)+' — '+cap);
  const typed=reduce?raw:raw.slice(0,Math.max(0,((age-0.42)*42)|0));
  c.font='13px '+F_B;
  const maxW=bodyW-56;
  const wrapped=layoutLines(c,typed,maxW,13,F_B).slice(0,2);
  wrapped.forEach((line,li)=>txt(c,(li===0?'▸ ':'')+line,bodyX+42,y+h-28+li*16,13,pl?'#ff9d2e':'#9a93a8','left',F_B,false));
  if(!reduce&&typed.length<raw.length){
   const pulse=0.35+0.65*Math.sin(gt*14);
   c.fillStyle='rgba(255,157,46,'+pulse+')';
   c.fillRect(bodyX+42,y+h-12,8,2);
  }
 }
 c.restore();
}

addEventListener('keydown',e=>{
 if(!BOOT.ready){e.preventDefault();return;}
 if(!AU.ctx)audioInit();
 const gameCodes=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD',
  'KeyZ','KeyX','KeyC','KeyP','BracketLeft','BracketRight',
  'ControlLeft','ControlRight','AltLeft','AltRight','ShiftLeft','ShiftRight','Tab','Escape',
  'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12','Backquote','Backspace'];
 const modAny=e.ctrlKey||e.altKey||e.metaKey;
 const blockAlways=gameCodes.includes(e.code)||(modAny&&(e.code.startsWith('Key')||e.code.startsWith('Arrow')||e.code.startsWith('Digit')||e.code.startsWith('F')));
 if(e.code==='Space'||blockAlways)e.preventDefault();
 if(e.code==='Tab'||e.code.startsWith('F'))e.preventDefault();
 keys[e.code]=true;
 if(e.repeat)return;
 press(e.code,e.key);});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('visibilitychange',()=>{if(document.hidden)for(const k in keys)keys[k]=false;});
function press(c,k){
 if(state==='press'){dismissPressStart();return;}
 if(c==='KeyM'&&state!=='cheats'){if(AU.ctx){settings.sound.musicOn=!settings.sound.musicOn;saveSettings();applyAudioSettings();}return;}
 if(state==='race'&&settings.controls.pause.includes(c)){
  if(paused){paused=false;}else{paused=true;pauseMenuIndex=0;}
  sClick();return;}
 if(state==='race'&&paused){
  const items=pauseRaceItems();
  const n=items.length;
  if(c==='ArrowUp'){pauseMenuIndex=(pauseMenuIndex+n-1)%n;sClick();return;}
  if(c==='ArrowDown'){pauseMenuIndex=(pauseMenuIndex+1)%n;sClick();return;}
  if(c==='Enter'||c==='Space'){
   const it=items[pauseMenuIndex];
   if(it==='ПРОДОЛЖИТЬ')paused=false;
   else if(it==='НАСТРОЙКИ'){openSettings('race');}
   else if(it==='РЕСТАРТ ГОНКИ')restartRace();
   else if(it==='ВЫБОР ТРАССЫ')enterTrackPick('race');
   else{paused=false;if(labTest)exitLabTest();else{raceTrackOverride=null;state='garage';}}
   sClick();}
  return;}
 if(state==='race'&&c==='KeyR'){restartRace();return;}
 if(state==='race'&&c==='F3'){settings.graphics.showFps=!settings.graphics.showFps;saveSettings();return;}
 if(state==='slotSelect'){
  if(c==='ArrowLeft'){slotSelectIndex=(slotSelectIndex+9)%10;sClick();}
  if(c==='ArrowRight'){slotSelectIndex=(slotSelectIndex+1)%10;sClick();}
  if(c==='ArrowUp'){slotSelectIndex=(slotSelectIndex+5)%10;sClick();}
  if(c==='ArrowDown'){slotSelectIndex=(slotSelectIndex+5)%10;sClick();}
  if(c==='Escape'){if(slotReturn==='title')enterTitle();else state=slotReturn;sClick();return;}
  if(c==='Backspace'||c==='Delete'){
   if(clearSaveSlot(slotSelectIndex))sClick();
   else sHit();
   return;
  }
  if(c==='Enter'||c==='Space'){
   if(slotSelectMode==='load'){
    if(slots[slotSelectIndex]){
     loadSave(slotSelectIndex);
     save=JSON.parse(JSON.stringify(slots[slotSelectIndex].save));
     state='garage';
    }else{
     sHit();
    }
   }else if(slotSelectMode==='save'){
    persist(slotSelectIndex);
    sCash();
    state='garage';
   }
   sClick();
  }
  return;
 }
 if(state==='settings'){
  if(settingsState==='main'){
   if(c==='ArrowUp'){settingsTab=(settingsTab+3)%4;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%4;sClick();}
   if(c==='Enter'||c==='Space'){
    if(settingsTab===0){settingsState='graphics';settingsTab=0;}
    else if(settingsTab===1){settingsState='sound';settingsTab=0;}
    else if(settingsTab===2){settingsState='game';settingsTab=0;}
    else leaveSettings();
    sClick();
   }
   if(c==='Escape'){leaveSettings();sClick();return;}
  }
  else if(settingsState==='graphics'){
   const n=gfxOpts().length;
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+n-1)%n;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%n;sClick();}
   if(c==='Enter'||c==='Space'){
    const opt=gfxOpts()[settingsTab];
    if(opt.type==='back'){settingsBack();sClick();}
    else if(opt.type!=='zoom'&&nudgeGraphics(1))sClick();
   }
   if(c==='ArrowLeft'||c==='ArrowRight'){
    if(nudgeGraphics(c==='ArrowRight'?1:-1))sClick();
   }
  }
  else if(settingsState==='sound'){
   const n=sndOpts().length;
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+n-1)%n;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%n;sClick();}
   if(c==='Enter'||c==='Space'){
    if(sndOpts()[settingsTab].type==='back'){settingsState='main';settingsTab=0;sClick();}
    else if(nudgeSound(1))sClick();
   }
   if(c==='ArrowLeft'||c==='ArrowRight'){
    if(nudgeSound(c==='ArrowRight'?1:-1))sClick();
   }
  }
  else if(settingsState==='game'){
   const n=gameOpts().length;
   if(c==='Escape'){settingsBack();sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+n-1)%n;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%n;sClick();}
   if(c==='Enter'||c==='Space'){
    const opt=gameOpts()[settingsTab];
    if(opt.type==='back'){settingsBack();sClick();}
    else if(opt.to){settingsState=opt.to;settingsTab=0;sClick();}
   }
  }
  else if(settingsState==='controls'){
   const keys_list=controlOpts();
   const n=keys_list.length;

   if(c==='Escape'){
    if(controlCaptureKey){
     if(captureBackup)settings.controls[controlCaptureKey]=captureBackup;
     controlCaptureKey=null;captureBackup=null;
     sClick();
    }else{settingsBack();sClick();}
    return;
   }

   if(controlCaptureKey){
    if(c==='Enter'){
     if(settings.controls[controlCaptureKey].length===0&&captureBackup){
      settings.controls[controlCaptureKey]=captureBackup;
     }
     controlCaptureKey=null;captureBackup=null;
     saveSettings();sClick();
     return;
    }
    if(c==='Backspace'){
     settings.controls[controlCaptureKey].pop();
     saveSettings();sClick();
     return;
    }
    const sysKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Tab','CapsLock','Backspace'];
    if(sysKeys.includes(c))return;

    const arr=settings.controls[controlCaptureKey];
    if(arr.includes(c))return;

    for(const k of Object.keys(settings.controls)){
     if(k!==controlCaptureKey){
      const idx=settings.controls[k].indexOf(c);
      if(idx>=0)settings.controls[k].splice(idx,1);
     }
    }
    if(arr.length<2)arr.push(c);
    else arr[1]=c;
    saveSettings();sClick();
    return;
   }

   if(c==='ArrowUp'){settingsTab=(settingsTab+n-1)%n;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%n;sClick();}
   if(c==='Enter'||c==='Space'){
    const key=keys_list[settingsTab];
    if(key.type==='back'){settingsBack();sClick();}
    else if(key.key==='_reset'){resetControls();sClick();}
    else{
     controlCaptureKey=key.key;
     captureBackup=(settings.controls[key.key]||[]).slice();
     settings.controls[key.key]=captureBackup.slice();
     saveSettings();sClick();
    }
   }
  }
  return;
 }
 if(state==='intro'){
  if(c==='Enter'){
   const sc=introScenes()[introFrame];
   if(!sc){endIntro(true);return;}
   if(introCur<sc.text.length)introCur=sc.text.length;
   else{
    introFrame++;
    if(introFrame>=introScenes().length)endIntro(true);
    else resetIntroType();
   }
   sClick();return;
  }
  return;
 }
 if(state==='gym'){
  if(c==='Escape'){state='garage';sClick();return;}
  if(c==='ArrowUp'){gymSel=(gymSel+3)%4;sClick();return;}
  if(c==='ArrowDown'){gymSel=(gymSel+1)%4;sClick();return;}
  if(c==='Enter'||c==='Space'){buyGym(gymSel);return;}
  return;
 }
 if(state==='tracks'){
  const n=TRACKDEFS.length,cols=3;
  if(c==='Escape'){
   if(trackPickReturn==='race'){state='race';paused=true;}
   else if(trackPickReturn==='garage'){state='garage';garagePaused=true;}
   else enterTitle();
   sClick();return;
  }
  if(c==='ArrowLeft'){trackPickSel=(trackPickSel+n-1)%n;sClick();return;}
  if(c==='ArrowRight'){trackPickSel=(trackPickSel+1)%n;sClick();return;}
  if(c==='ArrowUp'){trackPickSel=(trackPickSel+n-cols)%n;sClick();return;}
  if(c==='ArrowDown'){trackPickSel=(trackPickSel+cols)%n;sClick();return;}
  if(c==='Enter'||c==='Space'){startDevTrack(trackPickSel);return;}
  return;
 }
 if(state==='cheats'){
  if(c==='Escape'){state='title';sClick();return;}
  if(c==='ArrowLeft'){cheatCur=(cheatCur+6)%7;sClick();return;}
  if(c==='ArrowRight'){cheatCur=(cheatCur+1)%7;sClick();return;}
  if(c==='ArrowUp'){cheatBuf[cheatCur]=nextChar(cheatBuf[cheatCur],1);sClick();return;}
  if(c==='ArrowDown'){cheatBuf[cheatCur]=nextChar(cheatBuf[cheatCur],-1);sClick();return;}
  if(c==='Enter'){submitCheat();return;}
  if(k&&/^[a-z]$/i.test(k)){cheatBuf[cheatCur]=k.toLowerCase();cheatCur=(cheatCur+1)%7;sClick();return;}
  if(c==='Backspace'){cheatBuf[cheatCur]='a';sClick();return;}
  return;
 }
 if(state==='help'){enterTitle();return;}
 if(state==='achievements'){enterTitle();return;}
 if(state==='char'){
  if(bioOpen>=0){
   if(c==='Enter'){confirmCharPick(bioOpen);sClick();}
   else if(c==='Escape'){bioOpen=-1;sClick();}
   return;
  }
  if(c==='ArrowLeft'){pickChar(selChar-1);sClick();}
  if(c==='ArrowRight'){pickChar(selChar+1);sClick();}
  if(c==='Enter'||c==='KeyB'){bioOpen=selChar;sClick();}
  return;
 }
 if(state==='car'){
  if(c==='ArrowLeft'){pickCarSel(selCar-1);}
  if(c==='ArrowRight'){pickCarSel(selCar+1);}
  if(c==='Escape'){enterCharSel();return;}
  if(c==='Enter'){
   if(isForeignSignature(selCar)){sHit();return;}
   const car=CARS[selCar];
   const owned=carIsOwned(selCar);
   if(owned){if(carConfirmed&&save.car===selCar){state='garage';}
    else{save.car=selCar;persist();carConfirmed=true;sClick();}}
   else if(save.cash>=car.price){
    save.cash-=car.price;save.carOwned=save.carOwned||{};save.carOwned[selCar]=true;save.car=selCar;
    persist();carConfirmed=true;SFX.play('buy');}
   else sHit();}return;}
 if(state==='autopark'){
  if(c==='ArrowLeft')pickParkSel(autoparkSel-1);
  if(c==='ArrowRight')pickParkSel(autoparkSel+1);
  if(c==='Escape'){state='garage';sClick();}
  if(c==='Enter'||c==='Space'){
   if(carUnlocked(autoparkSel)){autodetailOpen=true;state='detail';sClick();}
   else sHit();
  }
  return;
 }
 if(state==='detail'){
  if(c==='Escape'){state='autopark';autodetailOpen=false;sClick();}
  if(c==='Enter'||c==='Space'){
   const car=CARS[autoparkSel];
   const owned=carIsOwned(autoparkSel);
   if(isForeignSignature(autoparkSel)){sHit();return;}
   if(owned){
    save.car=autoparkSel;persist();sClick();
    state='garage';garMsg='ВЫБРАНА: '+car.name;garMsgT=2.2;
   }else if(save.cash>=car.price){
    save.cash-=car.price;save.carOwned=save.carOwned||{};
    save.carOwned[autoparkSel]=true;save.car=autoparkSel;
    persist();SFX.play('buy');state='garage';
    garMsg='КУПЛЕНА: '+car.name;garMsgT=2.2;
   }else sHit();
  }
  return;
 }
 if(state==='prerace'){
  if(c==='ArrowUp'){save.bet=(save.bet+2)%3;persist();sClick();}
  if(c==='ArrowDown'){save.bet=(save.bet+1)%3;persist();sClick();}
  if(c==='Escape'){state='garage';sClick();}
  if(c==='Enter'||c==='Space'){raceTrackOverride=null;buildRace();}
  return;
 }
 if(state==='title'){
  const n=g._titleItems?g._titleItems.length:2;
  if(c==='ArrowUp'){selTitle=(selTitle+n-1)%n;resetArm=false;sClick();}
  if(c==='ArrowDown'){selTitle=(selTitle+1)%n;resetArm=false;sClick();}
  if(c==='Enter'||c==='Space'){
   const items=g._titleItems;
   const it=items[selTitle];
   if(it&&it.startsWith('НОВАЯ')){
    resetArm=false;save=newSave();persist();
    selChar=0;selCar=0;carConfirmed=false;enterCharSel();
   }
   else if(it&&it.startsWith('ПРОДОЛЖИТЬ')){resetArm=false;state='garage';}
   else if(it&&it.startsWith('ЗАГРУЗИТЬ')){resetArm=false;slotReturn='title';state='slotSelect';slotSelectMode='load';slotSelectIndex=0;}
   else if(it&&it.startsWith('НАСТРОЙКИ')){resetArm=false;openSettings('title');}
   else if(it&&it.startsWith('ДОСТИЖЕНИЯ')){resetArm=false;state='achievements';}
   else if(it&&it.startsWith('ЧИТЫ')){resetArm=false;state='cheats';cheatMsgT=0;}
   else if(it&&it.startsWith('ВЫБОР ТРАССЫ')){resetArm=false;enterTrackPick('title');}
   else if(it&&it.startsWith('СБРОС')){
    if(!resetArm){resetArm=true;sClick();}
    else{
     try{localStorage.removeItem(SKEY);}catch(e){}
     save=null;
     resetArm=false;sBoom();
    }
   }
   sClick();
  }return;}
 if(state==='results'){if(c==='Enter'){if(labTest)exitLabTest();else state='garage';sClick();}return;}
 if(state==='garage'&&c==='Escape'){
  if(garagePaused){garagePaused=false;}else{garagePaused=true;garagePauseIndex=0;}
  sClick();return;}
 if(state==='garage'&&garagePaused){
  const items=pauseGarageItems();
  const n=items.length;
  if(c==='ArrowUp'){garagePauseIndex=(garagePauseIndex+n-1)%n;sClick();return;}
  if(c==='ArrowDown'){garagePauseIndex=(garagePauseIndex+1)%n;sClick();return;}
  if(c==='Enter'||c==='Space'){
   const it=items[garagePauseIndex];
   if(it==='ПРОДОЛЖИТЬ')garagePaused=false;
   else if(it==='СОХРАНИТЬ ИГРУ'){garagePaused=false;slotReturn='garage';state='slotSelect';slotSelectMode='save';slotSelectIndex=0;}
   else if(it==='ЗАГРУЗИТЬ ИГРУ'){garagePaused=false;slotReturn='garage';state='slotSelect';slotSelectMode='load';slotSelectIndex=0;}
   else if(it==='НАСТРОЙКИ'){openSettings('garage');}
   else if(it==='ВЫБОР ТРАССЫ')enterTrackPick('garage');
   else{garagePaused=false;enterTitle();}
   sClick();}
  return;}
 if(state==='garage'){
  const rows=8;
  if(c==='ArrowUp'){tuningSel=(tuningSel+rows-1)%rows;sClick();}
  if(c==='ArrowDown'){tuningSel=(tuningSel+1)%rows;sClick();}
  if(c==='KeyA'){enterAutopark();sClick();}
  if(c==='KeyE'){location.href='Editor.html';return;}
  if(c==='Space'||(c==='Enter'&&tuningSel===7)){state='prerace';sClick();}
  else if(c==='Enter'){
   if(tuningSel===6){enterAutopark();sClick();}
   else garageAction(0,tuningSel);
  }
  return;
 }}
function garageAction(col,row){
 if(row===6){enterAutopark();sClick();return;}
 if(row===7){state='prerace';sClick();return;}
 if(row===5){gymSel=0;state='gym';sClick();return;}
 if(col===0){
  const tuningKeys=['arm','eng','tir','shk','nit'];
  const k=tuningKeys[row];
  const lvl=save.tuning[save.car][k];
  if(lvl>=6){garMsg='МАКСИМАЛЬНЫЙ УРОВЕНЬ';garMsgT=2.2;sHit();}
  else{
   const cost=UP_COSTS[k][lvl];
   if(save.cash>=cost){
    save.cash-=cost;save.tuning[save.car][k]++;
    persist();SFX.play('tune');garMsg='УСТАНОВЛЕНО: '+UP_INFO[k].n;garMsgT=2.2;
   }else{garMsg='НЕ ХВАТАЕТ '+fm(cost-save.cash);garMsgT=2.2;sHit();}
  }
 }
}
let mx=0,my=0;
cv.addEventListener('mousemove',e=>{
 const r=cv.getBoundingClientRect();
 const px=(e.clientX-r.left)*(cv.width/r.width),py=(e.clientY-r.top)*(cv.height/r.height);
 mx=(px-viewOX)/viewS;my=(py-viewOY)/viewS;
 if(settingsZoomDrag&&state==='settings'){
  const bar=(g._setHits||[]).find(b=>b.act==='zoombar');
  if(bar)setZoomFromPointer(mx,bar);
 }
});
cv.addEventListener('mouseup',()=>{settingsZoomDrag=false;});
cv.addEventListener('mouseleave',()=>{settingsZoomDrag=false;});
cv.addEventListener('wheel',e=>{
 if(state==='settings'&&settingsState==='graphics'){
  e.preventDefault();
  const dir=(e.deltaY>6||e.deltaX>6)?1:(e.deltaY<-6||e.deltaX<-6)?-1:0;
  if(!dir)return;
  settingsTab=0;
  nudgeCameraZoom(-dir);
  sClick();
  return;
 }
 if(state!=='car'&&state!=='autopark')return;
 e.preventDefault();
 if(gt-carSelWheelT<0.16)return;
 carSelWheelT=gt;
 const dir=(e.deltaY>6||e.deltaX>6)?1:(e.deltaY<-6||e.deltaX<-6)?-1:0;
 if(!dir)return;
 if(state==='car')pickCarSel(selCar+dir);
 else pickParkSel(autoparkSel+dir);
},{passive:false});
cv.addEventListener('mousedown',e=>{
 if(!BOOT.ready)return;
 if(!AU.ctx)audioInit();
 cv.focus();
 const r=cv.getBoundingClientRect();
 const px=(e.clientX-r.left)*(cv.width/r.width),py=(e.clientY-r.top)*(cv.height/r.height);
 const x=(px-viewOX)/viewS,y=(py-viewOY)/viewS;
 if(state==='intro'){press('Enter');return;}
 if(state==='press'){dismissPressStart();return;}
 if(state==='settings'){clickSettings(x,y);return;}
 if(state==='title'){
  const items=g._titleItems||[];
  const y0=g._titleY0||320,step=g._titleStep||52;
  items.forEach((t,i)=>{const yy=y0+i*step;if(y>yy-24&&y<yy+20&&Math.abs(x-W/2)<220){selTitle=i;press('Enter');}});}
 else if(state==='tracks'&&g._trackTiles){
  for(let i=0;i<g._trackTiles.length;i++){
   const b=g._trackTiles[i];
   if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){
    if(trackPickSel===i)startDevTrack(i);
    else{trackPickSel=i;sClick();}
    return;
   }
  }
 }
 else if(state==='results')press('Enter');
 else if(state==='garage'&&!garagePaused&&g._gar){for(const b of g._gar)
  if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){tuningSel=b.row;garageAction(0,b.row);break;}}
 else if(state==='char'){
  if(bioOpen>=0){
   if(g._statBtns)for(const b of g._statBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){upgradeCharStat(bioOpen,b.key);sClick();return;}}
   if(g._bioActs)for(const b of g._bioActs){
    if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){
     if(b.act==='pick')confirmCharPick(bioOpen);
     else bioOpen=-1;
     sClick();return;
    }
   }
   bioOpen=-1;sClick();return;
  }
  if(g._bioBtns)for(const b of g._bioBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){pickChar(b.idx);bioOpen=b.idx;sClick();return;}}
  if(g._charCards)for(const b of g._charCards){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){if(b.idx!==selChar){pickChar(b.idx);sClick();}return;}}
 }
 else if(state==='car'&&g._carSel){
  for(let k=g._carSel.length-1;k>=0;k--){
   const b=g._carSel[k];
   if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h)continue;
   if(b.act==='prev'){pickCarSel(selCar-1);return;}
   if(b.act==='next'){pickCarSel(selCar+1);return;}
   if(b.i!=null){pickCarSel(b.i);return;}
  }
 }
 else if(state==='gym'&&g._gymBtns){for(const b of g._gymBtns){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){gymSel=b.idx;buyGym(b.idx);sClick();return;}}}
 else if(state==='autopark'&&g._park){
  for(let k=g._park.length-1;k>=0;k--){
   const b=g._park[k];
   if(x<b.x||x>b.x+b.w||y<b.y||y>b.y+b.h)continue;
   if(b.act==='prev'){pickParkSel(autoparkSel-1);return;}
   if(b.act==='next'){pickParkSel(autoparkSel+1);return;}
   if(b.i!=null){
    if(b.i===autoparkSel){
     if(carUnlocked(b.i)){autodetailOpen=true;state='detail';sClick();}
     else sHit();
    }else pickParkSel(b.i);
    return;
   }
  }
 }
 else if(state==='help')enterTitle();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(state==='race'||state==='garage'||state==='title'||state==='press')e.preventDefault();});
addEventListener('popstate',e=>{if(state==='race'){e.preventDefault();try{history.pushState(null,'',location.href);}catch(err){}}});
try{bootGo();}catch(e){console.error(e);bootFinish();}
try{history.pushState(null,'',location.href);}catch(err){}
let last=performance.now(),fpsSmooth=60;
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;gt+=dt;
 fpsSmooth=lerp(fpsSmooth,1/dt,.1);
 if(saveFlash>0)saveFlash-=dt;
 if(garMsgT>0)garMsgT-=dt;
 if(cheatMsgT>0)cheatMsgT-=dt;
 updateView();
 g.setTransform(1,0,0,1,0,0);
 g.fillStyle='#050409';g.fillRect(0,0,cv.width,cv.height);
 if(viewOX>0||viewOY>0){
  const gr=g.createLinearGradient(0,0,0,cv.height);
  gr.addColorStop(0,'#0a0815');gr.addColorStop(1,'#1a1028');
  g.fillStyle=gr;g.fillRect(0,0,cv.width,cv.height);
 }
 g.setTransform(viewS,0,0,viewS,viewOX,viewOY);
 if(state==='results'&&R){
  if(R.msg){R.msg.t+=dt;if(R.msg.t>3.4)R.msg=null;}
  const n=(R.order&&R.order.length)||0;
  if(n){
   const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
   if(reduce)R.announcerT=99;
   else R.announcerT=(R.announcerT||0)+dt;
  }
 }
 if(state==='race'&&!paused)updRace(dt);
 updEngine(P,paused,state);
 if(CHIP.on)CHIP.pump();
 if(state==='intro'&&!introDone){
  const sc=introScenes()[introFrame];
  if(sc&&introCur<sc.text.length){
   introPrintT+=dt;
   const step=0.028;
   while(introPrintT>=step&&introCur<sc.text.length){
    introPrintT-=step;introCur++;
   }
  }
  if(keys.Space){
   introSkipT+=dt;
   if(introSkipT>=INTRO_SKIP_HOLD){endIntro(true);sClick();}
  }else introSkipT=0;
 }
 if(AU.ctx&&state!=='intro'){const mc=musicCat();if(mc!==lastMusicCat){lastMusicCat=mc;MUSIC.play(mc);}}
 if(state==='press'||state==='title'||state==='settings'){
  updateTitleRace(dt);
  if(state==='press'){pollPressStartPad();drawPressStart();}
  else if(state==='title')drawTitle();
  else drawSettings();
 }
 else if(state==='help')drawHelp();
 else if(state==='achievements')drawAchievements();
 else if(state==='cheats')drawCheats();
 else if(state==='tracks')drawTrackPick();
 else if(state==='slotSelect')drawSlotSelect();
 else if(state==='char'){drawCharSel();if(bioOpen>=0)drawBio();}
 else if(state==='intro')drawIntro();
 else if(state==='car')drawCarSel();
 else if(state==='garage')drawGarage();
 else if(state==='gym')drawGym();
 else if(state==='autopark')drawAutopark();
 else if(state==='detail')drawCarDetail();
 else if(state==='prerace')drawPreRace();
 else if(state==='results')drawResults();
 else if(state==='race'){drawRaceWorld();drawHUD();}
 g.setTransform(1,0,0,1,0,0);
 if(settings.graphics.showFps){
  g.fillStyle='#58ff6b';g.font='12px monospace';
  g.fillText(Math.round(fpsSmooth)+' FPS',10,20);
 }
 requestAnimationFrame(frame);}
try{bootGo();}catch(e){console.error(e);bootFinish();}
window.addEventListener('pageshow',()=>reloadEditorCars());
window.addEventListener('storage',e=>{
 if(!e.key||e.key===EDITOR_STORAGE_KEY||e.key===EDITOR_STORAGE_KEY+'.ts')reloadEditorCars();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reloadEditorCars();});
</script>
