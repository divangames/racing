let titleRacers=[],titleTrack=null,titleShots=[],titleParts=[],titleShocks=[],titleScorch=[],titleCam={x:0,y:0};
function initTitleRace(){
 const tIdx=(Math.random()*TRACKDEFS.length)|0;
 titleTrack=buildTrack(TRACKDEFS[tIdx],tIdx);
 titleTrack.img=prerender(titleTrack);
 titleRacers=[];titleShots=[];titleParts=[];titleShocks=[];titleScorch=[];
 const ci=[0,1,2,3,4,5];
 for(let i=ci.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=ci[i];ci[i]=ci[j];ci[j]=t;}
 for(let i=0;i<6;i++){
  const car=CARS[ci[i]],ch=CHARS[(Math.random()*CHARS.length)|0];
  const r=makeRacer(ch,car,false,{arm:2,eng:2,tir:2,shk:1},i);
  r.aiSkill=0.7+Math.random()*0.5;
  r.aiLane=(Math.random()*2-1)*45;
  const gi=Math.floor(titleTrack.N*(i/6));
  const p=titleTrack.S[gi];
  r.x=p.x+p.nx*r.aiLane;r.y=p.y+p.ny*r.aiLane;r.ang=p.ang;r.trackIdx=gi;
  r.spd=100+Math.random()*80;
  r.titleCd=Math.random()*0.8;
  titleRacers.push(r);
 }
 titleCam={x:titleRacers[0].x,y:titleRacers[0].y};
}
function tSpark(x,y,col,n){for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(30,220);titleParts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.2,.5),col,sz:rnd(2,4)});}}
function tBoom(x,y){
 for(let i=0;i<40;i++){const a=rnd(TAU),s=rnd(50,420);titleParts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rnd(.25,.85),col:['#ff9d2e','#ff3d2e','#ffd23f','#fff'][irnd4()],sz:rnd(3,8)});}
 for(let i=0;i<14;i++){const a=rnd(TAU),s=rnd(20,160);titleParts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.7,t:rnd(.5,1.1),col:['#555','#3a3530','#2a2624','#666'][irnd4()],sz:rnd(6,16)});}
 titleShocks.push({x,y,r:10,maxR:110,t:.45});
 titleScorch.push({x,y,r:34});
 if(titleScorch.length>40)titleScorch.shift();
}
function updateTitleRace(dt){
 if(!titleTrack||!titleRacers.length)return;
 const S=titleTrack.S,N=titleTrack.N;
 for(const r of titleRacers){
  if(r.dead){r.respawnT-=dt;
   if(r.respawnT<=0){const p=S[r.trackIdx];r.x=p.x+p.nx*r.aiLane;r.y=p.y+p.ny*r.aiLane;r.ang=p.ang;r.spd=0;r.hp=r.maxhp;r.dead=false;}
   continue;}
  const look=Math.floor(8+Math.abs(r.spd)*0.04);
  const i2=(r.trackIdx+look)%N;
  const tx=S[i2].x+S[i2].nx*r.aiLane,ty=S[i2].y+S[i2].ny*r.aiLane;
  const d=angDiff(Math.atan2(ty-r.y,tx-r.x),r.ang);
  const steer=clamp(d*2.2,-1,1);
  const top=r.st.top*0.8;
  if(r.spd<top)r.spd+=r.st.acc*0.8*dt;else r.spd=top;
  if(r.spd<80)r.spd=80;
  r.ang+=steer*r.st.crn*0.85*dt;
  r.x+=Math.cos(r.ang)*r.spd*dt;r.y+=Math.sin(r.ang)*r.spd*dt;
  let best=r.trackIdx,bd=1e18;
  for(let k=0;k<=12;k++){const i=(r.trackIdx+k)%N;const dx=r.x-S[i].x,dy=r.y-S[i].y;const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=i;}}
  r.trackIdx=best;
  r.tprog=(r.tprog||0)+r.spd*dt;
  r.wheelRot+=r.spd*dt*0.18;
  r.titleCd-=dt;
  if(r.titleCd<=0){
   let bt=null,bd2=1e9;
   for(const o of titleRacers){if(o===r||o.dead)continue;const dd=Math.hypot(o.x-r.x,o.y-r.y);if(dd<bd2){bd2=dd;bt=o;}}
   if(bt&&bd2<420){
    r.titleCd=0.25+Math.random()*0.6;
    const a=Math.atan2(bt.y-r.y,bt.x-r.x)+rnd(-.12,.12);
    titleShots.push({x:r.x+Math.cos(a)*26,y:r.y+Math.sin(a)*26,vx:Math.cos(a)*900,vy:Math.sin(a)*900,life:.6,owner:r});
   }else r.titleCd=.3;
  }

function prettyKey(code){
 return code
  .replace('Key','')
  .replace('Arrow','')
  .replace('Digit','')
  .replace('ShiftLeft','L-Shift')
  .replace('ShiftRight','R-Shift')
  .replace('ControlLeft','L-Ctrl')
  .replace('ControlRight','R-Ctrl')
  .replace('AltLeft','L-Alt')
  .replace('AltRight','R-Alt')
  .replace('MetaLeft','L-Meta')
  .replace('MetaRight','R-Meta')
  .replace('Numpad','Num ')
  .replace('Space','Space')
  .replace('Escape','Esc')
  .replace('Backquote','`')
  .replace('Equal','=')
  .replace('Minus','-');
}

function press(c){
 if(c==='KeyM'){if(AU.ctx){settings.sound.musicOn=!settings.sound.musicOn;saveSettings();applyAudioSettings();}return;}
 if(state==='race'&&settings.controls.pause.includes(c)){

 if(state==='race'&&paused){

  if(c==='ArrowDown'){pauseMenuIndex=(pauseMenuIndex+1)%n;sClick();return;}

   if(pauseMenuIndex===0){paused=false;}

   }else if(slotSelectMode==='save'){

  }

 }
 if(state==='settings'){
  if(settingsState==='main'){
   if(c==='ArrowUp'){settingsTab=(settingsTab+3)%4;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%4;sClick();}
   if(c==='Enter'||c==='Space'){
    if(settingsTab===0){settingsState='graphics';settingsTab=0;}
    else if(settingsTab===1){settingsState='controls';settingsTab=0;}
    else if(settingsTab===2){settingsState='sound';settingsTab=0;}
    else{if(settingsReturn==='title')enterTitle();else state=settingsReturn;settingsState='main';settingsTab=0;}
    sClick();
   }
   if(c==='Escape'){if(settingsReturn==='title')enterTitle();else state=settingsReturn;settingsState='main';settingsTab=0;sClick();return;}
  }
  else if(settingsState==='graphics'){
   const opts=['resolution','particles','skids','weather','shake','showFps'];
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+5)%6;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%6;sClick();}
   if(c==='ArrowLeft'||c==='ArrowRight'){
    const key=opts[settingsTab];
    if(key==='resolution'){
     const n=RESOLUTIONS.length,cur=settings.graphics.resolution||0;
     settings.graphics.resolution=c==='ArrowRight'?(cur+1)%n:(cur+n-1)%n;
     applyResolution();
    }
    else if(key==='particles'){
     const vals=['low','medium','high'];
     const idx=vals.indexOf(settings.graphics.particles);
     settings.graphics.particles=vals[c==='ArrowRight'?(idx+1)%3:(idx+2)%3];
    }else{
     settings.graphics[key]=!settings.graphics[key];
    }
    saveSettings();sClick();
   }
  }
  else if(settingsState==='sound'){
   if(c==='Escape'){settingsState='main';settingsTab=0;sClick();return;}
   if(c==='ArrowUp'){settingsTab=(settingsTab+3)%4;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%4;sClick();}
   if(c==='ArrowLeft'||c==='ArrowRight'){
    const dir=c==='ArrowRight'?1:-1;
    if(settingsTab===0){
     settings.sound.music=clamp(settings.sound.music+dir*10,0,100);
     if(AU.ctx)applyAudioSettings();
    }
    else if(settingsTab===1){
     settings.sound.sfx=clamp(settings.sound.sfx+dir*10,0,100);
     if(AU.ctx)AU.sfx.gain.value=settings.sound.sfx/100*.9;
    }
    else if(settingsTab===2){
     settings.sound.musicOn=!settings.sound.musicOn;
     if(AU.ctx)applyAudioSettings();
    }
    else if(settingsTab===3){
     settings.sound.sfxOn=!settings.sound.sfxOn;
    }
    saveSettings();
    sClick();
   }
  }
  else if(settingsState==='controls'){
   const keys_list=['up','down','left','right','pause','_reset'];
   
   if(c==='Escape'){
    if(controlCaptureKey){
     if(captureBackup)settings.controls[controlCaptureKey]=captureBackup;
     controlCaptureKey=null;captureBackup=null;
     sClick();
    }else{settingsState='main';settingsTab=0;sClick();}
    return;
   }
   
   if(controlCaptureKey){
    if(c==='Enter'){
     if(settings.controls[controlCaptureKey].length===0&&captureBackup){
      settings.controls[controlCaptureKey]=captureBackup;
     }
     controlCaptureKey=null;captureBackup=null;
     saveSettings();sClick();
     return;
    }
    if(c==='Backspace'){
     settings.controls[controlCaptureKey].pop();
     saveSettings();sClick();
     return;
    }
    // Игнорируем системные клавиши (но Space — разрешаем)
    const sysKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Tab','CapsLock','Backspace'];
    if(sysKeys.includes(c))return;
    
    const arr=settings.controls[controlCaptureKey];
    if(arr.includes(c))return; // уже есть — игнор
    
    // Удаляем эту клавишу из других действий
    for(const k of Object.keys(settings.controls)){
     if(k!==controlCaptureKey){
      const idx=settings.controls[k].indexOf(c);
      if(idx>=0)settings.controls[k].splice(idx,1);
     }
    }
    if(arr.length<2)arr.push(c);
    else arr[1]=c; // заменяем вторую
    saveSettings();sClick();
    return;
   }
   
   if(c==='ArrowUp'){settingsTab=(settingsTab+5)%6;sClick();}
   if(c==='ArrowDown'){settingsTab=(settingsTab+1)%6;sClick();}
   if(c==='Enter'||c==='Space'){
    const key=keys_list[settingsTab];
    if(key==='_reset'){
     resetControls();sClick();
    }else{
     controlCaptureKey=key;
     captureBackup=(settings.controls[key]||[]).slice();
     settings.controls[key]=captureBackup.slice(); // редактируем копию
     saveSettings();sClick();
    }
   }
  }
  return;
 }

 if(state==='prerace'){

function garageAction(col,row){

   }else{garMsg='НЕ ХВАТАЕТ $'+(cost-save.cash);garMsgT=2.2;sHit();}
  }
 }
}

 else if(state==='char')drawCharSel();
 else if(state==='car')drawCarSel();
 else if(state==='garage')drawGarage();
 else if(state==='autopark')drawAutopark();
 else if(state==='detail')drawCarDetail();
 else if(state==='prerace')drawPreRace();
 else if(state==='results')drawResults();
 else if(state==='race'){drawRaceWorld();drawHUD();}
 g.setTransform(1,0,0,1,0,0);
 if(settings.graphics.showFps){
  g.fillStyle='#58ff6b';g.font='12px monospace';
  g.fillText(Math.round(fpsSmooth)+' FPS',10,20);
 }
 requestAnimationFrame(frame);}
